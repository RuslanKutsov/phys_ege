/* Читает из DOM все текстовые поля/ответы уже существующих задач параграфа
   (картинки не трогает — они и так живут в teacherDrafts актуально, без
   привязки к кнопке "Сохранить") и переносит их в переданный blob-объект.
   Используется и кнопкой "Сохранить все", и добавлением/вставкой новой
   задачи — чтобы несохранённые правки в старых задачах не терялись. */
function syncParBlobFromDOM(par, blob){
  problemsForPar(par).forEach(n=>{
    const key = pKey(par, n);
    const textEl = document.getElementById('text-'+key);
    const answerEl = document.getElementById('answer-'+key);
    const solutionEl = document.getElementById('solution-'+key);
    const draft = teacherDrafts[key];
    const text = textEl ? textEl.value.trim() : (draft ? draft.text : (blob[n]&&blob[n].text)||'');
    const answer = answerEl ? answerEl.value.trim() : (draft ? draft.answer : (blob[n]&&blob[n].answer)||'');
    const solutionText = solutionEl ? solutionEl.value.trim() : (draft ? draft.solutionText : (blob[n]&&blob[n].solutionText)||'');
    const solutionImages = draft ? (draft.solutionImages||[]) : ((blob[n]&&blob[n].solutionImages)||[]);
    const images = draft ? (draft.images||[]) : ((blob[n]&&blob[n].images)||[]);
    const wideImages = draft ? (draft.wideImages||[]) : ((blob[n]&&blob[n].wideImages)||[]);

    const fuCheckEl = document.getElementById('fu-check-'+key);
    const fuTextEl = document.getElementById('fu-text-'+key);
    const fuAnswerEl = document.getElementById('fu-answer-'+key);
    const fuSolutionEl = document.getElementById('fu-solution-'+key);
    const prevFollowUp = blob[n] && blob[n].followUp;
    const hasFollowUp = fuCheckEl ? fuCheckEl.checked : (draft ? !!draft.hasFollowUp : !!prevFollowUp);
    const fuText = fuTextEl ? fuTextEl.value.trim() : (draft ? draft.fuText : (prevFollowUp && prevFollowUp.text) || '');
    const fuAnswer = fuAnswerEl ? fuAnswerEl.value.trim() : (draft ? draft.fuAnswer : (prevFollowUp && prevFollowUp.answer) || '');
    const fuSolutionText = fuSolutionEl ? fuSolutionEl.value.trim() : (draft ? draft.fuSolutionText : (prevFollowUp && prevFollowUp.solutionText) || '');
    const fuSolutionImages = draft ? (draft.fuSolutionImages||[]) : ((prevFollowUp && prevFollowUp.solutionImages) || []);
    const fuImages = draft ? (draft.fuImages||[]) : ((prevFollowUp && prevFollowUp.images) || []);
    const fuWideImages = draft ? (draft.fuWideImages||[]) : ((prevFollowUp && prevFollowUp.wideImages) || []);
    const followUp = hasFollowUp ? { text: fuText, answer: fuAnswer, solutionText: fuSolutionText, solutionImages: fuSolutionImages, images: fuImages, wideImages: fuWideImages } : undefined;

    // Наводящие вопросы (Повышенный уровень): берём из поля цепочек, иначе — то, что уже было,
    // иначе «Сохранить все» затёрло бы hint_chain у всех задач параграфа.
    let hintChain = (blob[n] && blob[n].hintChain) || null;
    if(isPovyshPar(par)){
      const chainsEl = document.getElementById('chains-'+key);
      if(chainsEl) hintChain = parseGuidedChains(chainsEl.value);
    }

    blob[n] = { text, answer, solutionText, solutionImages, images, wideImages, followUp, hintChain };
    if(draft){ draft.text = text; draft.answer = answer; draft.solutionText = solutionText; draft.solutionImages = solutionImages; draft.hasFollowUp = hasFollowUp; draft.fuText = fuText; draft.fuAnswer = fuAnswer; draft.fuSolutionText = fuSolutionText; draft.fuSolutionImages = fuSolutionImages; }
  });
}

/* Кнопка "Сохранить все изменения в параграфе" — по одному запросу на
   задачу (раньше был один общий блок, но в Supabase каждая задача — это
   отдельная строка). Считаем, что в этот момент ученики ответы не вводят
   (правки результатов не затрагиваются). */
async function saveAllProblems(){
  const par = teacherSelectedPar;
  const btn = document.getElementById('save-all-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Сохраняем...'; }

  const blob = getParBlob(par);
  syncParBlobFromDOM(par, blob);

  // Та же защита от случайной потери эталонного ответа, что и в
  // saveProblemEdit — но сразу по всем задачам параграфа, до отправки
  // чего-либо на сервер.
  const wiped = problemsForPar(par).filter(n=>{
    const prevAk = teacherAnswerKeyCache[dbId(par, n)];
    const hadAnswerBefore = !!(prevAk && ((prevAk.answer && prevAk.answer.trim()) || (prevAk.solutionText && prevAk.solutionText.trim()) || (prevAk.solutionImages && prevAk.solutionImages.length)));
    const b = blob[n];
    const willBeEmpty = !!b && !b.answer && !(b.solutionText && b.solutionText.trim()) && !(b.solutionImages && b.solutionImages.length);
    return hadAnswerBefore && willBeEmpty;
  }).map(n=>taskLabel(par,n));
  if(wiped.length){
    const proceed = await customConfirm('Внимание: сохранение удалит ранее сохранённый эталонный ответ/решение у задач: '+wiped.join(', ')+'.\nЭто обычно означает, что поля не успели загрузиться. Всё равно сохранить всё как есть?');
    if(!proceed){ if(btn){ btn.disabled = false; btn.textContent = 'Сохранить все изменения в §'+par; } return; }
  }

  let allOk = true;
  for(const n of problemsForPar(par)){
    const ok = await saveProblem(pKey(par, n), blob[n]);
    if(!ok) allOk = false;
  }

  if(allOk) await customAlert('Все задачи параграфа сохранены');
  else await customAlert('Не всё удалось сохранить — попробуйте ещё раз.');
  await renderProblemsTab();
  renderSidebar();
}

function followUpFromForm(key){
  const cb = document.getElementById('fu-check-'+key);
  if(!cb || !cb.checked) return undefined;
  const textEl = document.getElementById('fu-text-'+key);
  const answerEl = document.getElementById('fu-answer-'+key);
  const solutionEl = document.getElementById('fu-solution-'+key);
  const d = teacherDrafts[key] || {};
  return {
    text: textEl ? textEl.value.trim() : (d.fuText||''),
    answer: answerEl ? answerEl.value.trim() : (d.fuAnswer||''),
    solutionText: solutionEl ? solutionEl.value.trim() : (d.fuSolutionText||''),
    solutionImages: d.fuSolutionImages || [],
    images: d.fuImages || [],
    wideImages: d.fuWideImages || []
  };
}

let addProblemBusy = false;

async function addProblem(btn){
  if(addProblemBusy) return; // защита от двойного клика — не шлём два запроса к хранилищу подряд
  addProblemBusy = true;
  const originalLabel = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.textContent = 'Сохраняем...'; }
  try{
    const text = document.getElementById('new-text').value.trim();
    const answer = document.getElementById('new-answer').value.trim();
    const solutionText = document.getElementById('new-solution').value.trim();
    const solutionImages = teacherDrafts['new'].solutionImages || [];
    const images = teacherDrafts['new'].images;
    const wideImages = teacherDrafts['new'].wideImages;
    const followUp = followUpFromForm('new');
    const par = teacherSelectedPar;

    let hintChain = null;
    if(isPovyshPar(par)){
      const chainsEl = document.getElementById('chains-new');
      if(chainsEl) hintChain = parseGuidedChains(chainsEl.value);
    }

    // сохраняем несохранённые правки в уже существующих задачах параграфа
    // (если они были) — иначе они потеряются при перезаписи блоба
    syncParBlobFromDOM(par, getParBlob(par));

    if(insertAfterNum !== null){
      const afterNumSnapshot = insertAfterNum;
      let ok = await insertProblemAfter(par, afterNumSnapshot, {text, answer, solutionText, solutionImages, images, wideImages, followUp, hintChain});
      insertAfterNum = null;
      if(!ok) await handleSaveFailure(()=>insertProblemAfter(par, afterNumSnapshot, {text, answer, solutionText, solutionImages, images, wideImages, followUp, hintChain}));
    } else {
      const nums = problemsForPar(par);
      const num = nums.length ? Math.max(...nums)+1 : 1;
      const key = pKey(par,num);
      let ok = await saveProblem(key, {text, answer, solutionText, solutionImages, images, wideImages, followUp, hintChain});
      if(!ok) await handleSaveFailure(()=>saveProblem(key, {text, answer, solutionText, solutionImages, images, wideImages, followUp, hintChain}));
    }
    await renderProblemsTab();
    renderSidebar();
  } finally {
    addProblemBusy = false;
    // btn может уже не существовать в DOM после renderProblemsTab() — это ок, просто пропускаем
    if(btn && document.body.contains(btn)){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}

const saveProblemBusy = {}; // key -> true, пока запрос в процессе

async function saveProblemEdit(key, btn){
  if(saveProblemBusy[key]) return; // защита от двойного клика
  saveProblemBusy[key] = true;
  const originalLabel = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.textContent = 'Сохраняем...'; }
  try{
    const text = document.getElementById('text-'+key).value.trim();
    const answer = document.getElementById('answer-'+key).value.trim();
    const solutionText = document.getElementById('solution-'+key).value.trim();
    const solutionImages = teacherDrafts[key] ? (teacherDrafts[key].solutionImages||[]) : [];
    const images = teacherDrafts[key] ? teacherDrafts[key].images : [];
    const wideImages = teacherDrafts[key] ? teacherDrafts[key].wideImages : [];
    const followUp = followUpFromForm(key);

    const [parForChains] = key.split('-').map(Number);
    let hintChain = null;
    if(isPovyshPar(parForChains)){
      const chainsEl = document.getElementById('chains-'+key);
      if(chainsEl) hintChain = parseGuidedChains(chainsEl.value);
    }

    // Защита от случайной потери эталонного ответа: update_question удаляет
    // строку answer_key целиком, если и ответ, и решение пусты. Если до этой
    // правки у задачи БЫЛ ответ/решение (по данным teacherAnswerKeyCache), а
    // сейчас оба поля пусты — почти всегда это значит, что поле просто не
    // успело загрузиться (например при большом числе задач), а не осознанное
    // решение стереть ответ.
    const [par, num] = key.split('-').map(Number);
    const prevAk = teacherAnswerKeyCache[dbId(par, num)];
    const hadAnswerBefore = !!(prevAk && ((prevAk.answer && prevAk.answer.trim()) || (prevAk.solutionText && prevAk.solutionText.trim()) || (prevAk.solutionImages && prevAk.solutionImages.length)));
    const willBeEmpty = !answer && !solutionText && !(solutionImages && solutionImages.length);
    if(hadAnswerBefore && willBeEmpty){
      const proceed = await customConfirm('У задачи '+taskLabel(par,num)+' сейчас пусты и «Правильный ответ», и «Решение» — сохранение УДАЛИТ ранее сохранённый эталонный ответ/решение из базы.\nЭто обычно означает, что поле просто не успело загрузиться. Всё равно сохранить и удалить ответ?');
      if(!proceed) return;
    }

    let ok = await saveProblem(key, {text, answer, solutionText, solutionImages, images, wideImages, followUp, hintChain});
    if(!ok){ ok = await handleSaveFailure(()=>saveProblem(key, {text, answer, solutionText, solutionImages, images, wideImages, followUp, hintChain})); }
    if(ok) await customAlert('Сохранено');
  } finally {
    saveProblemBusy[key] = false;
    if(btn && document.body.contains(btn)){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}

async function deleteProblem(key, btn){
  if(!await customConfirm('Удалить задачу '+taskLabel(...key.split('-').map(Number))+'? Результат по ней будет удалён у всех учеников, а номера последующих задач параграфа сдвинутся на 1.')) return;
  if(btn){ btn.disabled = true; btn.textContent = 'Удаляем...'; }
  let ok = await deleteProblemStorage(key);
  if(!ok) ok = await handleSaveFailure(()=>deleteProblemStorage(key));
  await renderProblemsTab();
  renderSidebar();
}

/* ---------- INSERT AFTER (renумерация — теперь один запрос на параграф) ---------- */
async function insertProblemAfter(par, afterNum, newContent){
  const btn = document.querySelector('#add-form .btn-dark');
  if(btn){ btn.disabled = true; btn.textContent = 'Сохраняем...'; }

  const hasFollowUp = !!newContent.followUp;
  const { error } = await sbRpc('add_question', {
    p_password_hash: state.teacherPasswordHash,
    p_par: par,
    p_num: afterNum + 1,
    p_text: newContent.text || '',
    p_images: newContent.images || [],
    p_wide_images: newContent.wideImages || [],
    p_has_follow_up: hasFollowUp,
    p_follow_up_text: hasFollowUp ? (newContent.followUp.text||'') : null,
    p_follow_up_images: hasFollowUp ? (newContent.followUp.images||[]) : [],
    p_follow_up_wide_images: hasFollowUp ? (newContent.followUp.wideImages||[]) : [],
    p_answer: newContent.answer || '',
    p_follow_up_answer: hasFollowUp ? (newContent.followUp.answer||'') : null,
    p_solution_text: newContent.solutionText || null,
    p_solution_images: newContent.solutionImages || [],
    p_follow_up_solution_text: hasFollowUp ? (newContent.followUp.solutionText||null) : null,
    p_follow_up_solution_images: hasFollowUp ? (newContent.followUp.solutionImages||[]) : [],
    p_hint_chain: newContent.hintChain || null
  });
  if(error){ lastStorageError = error; return false; }
  await ensureParLoaded(par, true);
  await loadTeacherAnswerKey();
  return true;
}

let resultsCache = null;
let answerKeyCache = {}; // "par.num" -> {answer, followUpAnswer}
let attemptsCache = {}; // studentName -> "par-num"(-followup) -> [{answer, is_correct, attempt_number}] — ПОЛНАЯ история попыток (не только последняя)
let guidedResultsCache = {}; // studentName -> "par.num" -> {touched, hintViewed, color, ts} — Профильный уровень

async function renderResultsTab(){
  const body = document.getElementById('tm-body');
  body.innerHTML = `<p>Загрузка результатов...</p>`;

  const [{ data: summary, error: sErr }, { data: keyRows, error: kErr }, { data: attemptRows, error: aErr }, { data: guidedRows, error: gErr }] = await Promise.all([
    sbRpcAll('get_teacher_summary', { p_password_hash: state.teacherPasswordHash }),
    sbRpcAll('get_teacher_answer_key', { p_password_hash: state.teacherPasswordHash }),
    sbRpcAll('get_teacher_attempts', { p_password_hash: state.teacherPasswordHash }),
    sbRpcAll('get_teacher_guided_progress', { p_password_hash: state.teacherPasswordHash })
  ]);

  if(sErr || kErr || aErr || gErr){
    body.innerHTML = `<p>Не удалось загрузить результаты. Попробуйте «Обновить данные».</p>`;
    return;
  }

  // Профильный уровень: { student_name: { "par.num": {touched, hintViewed, color, ts} } }
  guidedResultsCache = {};
  (guidedRows||[]).forEach(r=>{
    if(!guidedResultsCache[r.student_name]) guidedResultsCache[r.student_name] = {};
    guidedResultsCache[r.student_name][r.question_id] = {
      touched: !!r.touched, hintViewed: !!r.hint_viewed, color: r.color || null,
      ts: r.last_timestamp ? new Date(r.last_timestamp).getTime() : Date.now()
    };
  });

  // Полная история ответов (все попытки, не только последняя) — группируем
  // по ученику и задаче, сортируем по номеру попытки для показа в порядке
  // "как отвечал" в колонке "Ответы ученика".
  attemptsCache = {};
  (attemptRows||[]).forEach(r=>{
    if(!attemptsCache[r.student_name]) attemptsCache[r.student_name] = {};
    const baseKey = dbIdToKey(r.question_id);
    const key = r.is_follow_up ? followUpDataKey(baseKey) : baseKey;
    if(!attemptsCache[r.student_name][key]) attemptsCache[r.student_name][key] = [];
    attemptsCache[r.student_name][key].push({ answer: r.answer, is_correct: r.is_correct, attempt_number: r.attempt_number });
  });
  Object.keys(attemptsCache).forEach(name=>{
    Object.keys(attemptsCache[name]).forEach(key=>{
      attemptsCache[name][key].sort((a,b)=>a.attempt_number-b.attempt_number);
    });
  });

  answerKeyCache = {};
  (keyRows||[]).forEach(r=>{ answerKeyCache[r.question_id] = { answer: r.answer, followUpAnswer: r.follow_up_answer, solutionText: r.solution_text, followUpSolutionText: r.follow_up_solution_text, solutionImages: r.solution_images || [], followUpSolutionImages: r.follow_up_solution_images || [] }; });

  const list = [];
  const allData = {};
  (summary||[]).forEach(row=>{
    if(!allData[row.student_name]){ allData[row.student_name] = {}; list.push(row.student_name); }
    const baseKey = dbIdToKey(row.question_id);
    const key = row.is_follow_up ? followUpDataKey(baseKey) : baseKey;
    allData[row.student_name][key] = {
      given: row.last_answer || '',
      correct: !!row.last_correct,
      ts: row.last_timestamp ? new Date(row.last_timestamp).getTime() : Date.now(),
      attempts: row.attempts || 0,
      hintViewed: !!row.hint_viewed
    };
  });
  // Ученики, которые на Профильном уровне только открывали ответ/указание
  // (обычных ответов нет) — тоже должны попасть в список и в таблицу.
  Object.keys(guidedResultsCache).forEach(name=>{
    const g = guidedResultsCache[name];
    const active = Object.keys(g).some(q=> g[q].touched || g[q].color);
    if(active && !allData[name]){ allData[name] = {}; list.push(name); }
  });
  list.sort((a,b)=>a.localeCompare(b));

  resultsViewMode = 'table';
  resultsCache = { list, allData };
  // Сводная таблица "Все ученики" (имя + время последнего ответа) не
  // обращается к текстам задач вообще — открывается сразу, без похода за
  // параграфами в Supabase. Параграфы конкретного ученика подгружаются
  // только когда учитель выбирает его в списке — см. onStudentFilterChange.
  drawResults('__all__');
}

let resultsViewMode = 'table'; // 'table' | 'map' — карта по параграфам доступна только для конкретного ученика

/* Параграфы, которые понадобятся для полной таблицы конкретного ученика —
   только те, где у НЕГО есть хоть один ответ (а не все параграфы вообще). */
function parsNeededForStudent(name){
  const data = (resultsCache && resultsCache.allData[name]) || {};
  const pars = new Set();
  Object.keys(data).forEach(key=>{
    const baseKey = key.endsWith('-followup') ? key.slice(0, -('-followup'.length)) : key;
    pars.add(Number(baseKey.split('-')[0]));
  });
  return Array.from(pars);
}

async function onStudentFilterChange(name){
  if(name === '__all__'){ drawResults('__all__'); return; }
  const body = document.getElementById('tm-body');
  if(resultsViewMode === 'map'){
    if(!state.parBlobsLoaded){ await loadAllParBlobs(false, (done,total)=>{ body.innerHTML = `<p>Загрузка карты задач... ${done} из ${total}</p>`; }); }
  } else {
    const missing = parsNeededForStudent(name).filter(p=>!parLoaded[p]);
    if(missing.length){
      body.innerHTML = `<p>Загрузка результатов...</p>`;
      await loadParsSequentially(missing, false, (done,total)=>{ body.innerHTML = `<p>Загрузка результатов... ${done} из ${total}</p>`; });
    }
  }
  drawResults(name);
}

/* Клик по строке ученика в сводной таблице ("Все ученики") — то же самое,
   что выбрать его в выпадающем списке. */
function selectStudentFromSummary(name){
  const sel = document.getElementById('student-filter');
  if(sel) sel.value = name;
  onStudentFilterChange(name);
}

async function toggleResultsView(){
  const selectedStudent = document.getElementById('student-filter') ? document.getElementById('student-filter').value : '__all__';
  if(resultsViewMode === 'table'){
    const body = document.getElementById('tm-body');
    body.innerHTML = `<p>Загрузка карты задач...</p>`;
    await loadAllParBlobs(false, (done,total)=>{ body.innerHTML = `<p>Загрузка карты задач... ${done} из ${total}</p>`; }); // нужно знать полный список задач каждого параграфа, не только отвеченные
    resultsViewMode = 'map';
  } else {
    resultsViewMode = 'table';
  }
  drawResults(selectedStudent);
}

/* Статус конкретной задачи для карты ученика: та же логика цвета, что в
   кружках сайдбара (chipHtml), но по переданным данным конкретного ученика,
   а не по state.studentData текущего вошедшего профиля. */
function studentChipStatus(data, par, num){
  const rec = data[pKey(par, num)];
  if(!rec) return 'unsolved';
  if(rec.correct) return (rec.attempts>1) ? 'retry' : 'correct';
  return (rec.given && rec.given.trim()) ? 'wrong' : 'touched';
}

function renderStudentMapHtml(name){
  const data = (resultsCache && resultsCache.allData[name]) || {};
  return `
    <div class="stu-map-legend">
      <span><i style="background:var(--green); border-color:var(--green);"></i>Верно с 1-й попытки</span>
      <span><i style="background:var(--amber); border-color:var(--amber);"></i>Верно не с 1-й попытки</span>
      <span><i style="background:var(--red); border-color:var(--red);"></i>Сейчас неверно</span>
      <span><i style="background:#7C8AA3; border-color:#7C8AA3;"></i>Приступил</span>
      <span><i style="background:var(--surface);"></i>Не решено</span>
    </div>
    ${CURRICULUM.map(sec=>{
      const skipSubHeader = sec.subs.length === 1 && sec.subs[0].name === sectionBareName(sec.section);
      return `
      <div class="stu-map-sec">
        <div class="stu-map-sec-title">${escapeHtml(sec.section)}</div>
        ${sec.subs.map(sub=>`
          <div class="stu-map-sub">
            ${skipSubHeader ? '' : `<div class="stu-map-sub-title">${escapeHtml(sub.name)}</div>`}
            ${sub.pars.map(p=>{
              const nums = problemsForPar(p.num);
              if(!nums.length) return '';
              return `
              <div class="stu-map-par">
                <div class="stu-map-par-head">
                  <span class="stu-map-par-label">§${p.num}</span>
                  <span class="stu-map-par-title">${escapeHtml(PAR_INDEX[p.num].title)}</span>
                </div>
                <div class="stu-map-chips">
                  ${nums.map(n=>{
                    if(isGuidedPar(p.num)){
                      const qid = dbId(p.num, n);
                      const gp = (guidedResultsCache[name] || {})[qid];
                      const cls = gp ? (gp.color || (gp.touched ? 'touched' : '')) : '';
                      const hinted = gp && gp.hintViewed && gp.color !== 'yellow';
                      return `<span class="chip ${cls||'unsolved'} ${hinted?'hinted-border':''}" style="cursor:pointer;" title="Задача ${taskLabel(p.num,n)} (Профильный уровень) — нажмите, чтобы посмотреть и оценить" onclick="showProblemPreview(${p.num},${n},'${escapeAttr(name)}')">${taskLabel(p.num,n)}</span>`;
                    }
                    const st = studentChipStatus(data, p.num, n);
                    const key = pKey(p.num, n);
                    const rec = data[key];
                    const fuRec = data[followUpDataKey(key)];
                    const prob = (getParBlob(p.num) || {})[n];
                    const hasFollowUp = !!(prob && prob.followUp && ((prob.followUp.text && prob.followUp.text.trim()) || (prob.followUp.images && prob.followUp.images.length) || (prob.followUp.wideImages && prob.followUp.wideImages.length)));
                    const everWrongOnMain = !!(rec && (!rec.correct || rec.attempts > 1));
                    const followUpPending = hasFollowUp && everWrongOnMain && !(fuRec && fuRec.correct);
                    const hintedBorder = isPovyshPar(p.num) && rec && rec.hintViewed && st !== 'retry';
                    return `<span class="chip ${st==='unsolved'?'unsolved':st} ${followUpPending?'followup-pending':''} ${hintedBorder?'hinted-border':''}" style="cursor:pointer;" title="Задача ${taskLabel(p.num,n)}${followUpPending?' — есть нерешённая доп. задача':''} — нажмите, чтобы посмотреть текст" onclick="showProblemPreview(${p.num},${n},'${escapeAttr(name)}')">${taskLabel(p.num,n)}</span>`;
                  }).join('')}
                </div>
              </div>`;
            }).join('')}
          </div>
        `).join('')}
      </div>
    `;
    }).join('')}
  `;
}

let resultsSort = { field: 'ts', dir: 'desc' };

function setResultsSort(field){
  if(resultsSort.field === field){
    resultsSort.dir = resultsSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    resultsSort.field = field;
    resultsSort.dir = 'asc';
  }
  drawResults(document.getElementById('student-filter') ? document.getElementById('student-filter').value : '__all__');
}

function sortArrow(field){
  if(resultsSort.field !== field) return '<span style="opacity:.3;">↕</span>';
  return resultsSort.dir === 'asc' ? '↑' : '↓';
}

/* Список ВСЕХ ответов ученика по конкретной задаче (в порядке попыток),
   а не только последнего — берётся из attemptsCache (полная история из
   таблицы attempts), в отличие от resultsCache.allData, где на пару
   ученик+задача хранится только последняя попытка (это нужно для быстрой
   сводной таблицы "Все ученики" и для карты по параграфам). Верный ответ
   в списке выделяется зелёным жирным, чтобы сразу было видно, каким по
   счёту он получился. */
function answersListHtml(studentName, key){
  const arr = (attemptsCache[studentName] && attemptsCache[studentName][key]) || [];
  if(!arr.length) return '';
  return arr.map(a=> a.is_correct
    ? `<b style="color:var(--green);">${escapeHtml(a.answer)}</b>`
    : escapeHtml(a.answer)
  ).join('; ');
}

function drawResults(selectedStudent){
  const body = document.getElementById('tm-body');
  const { list, allData } = resultsCache;
  if(selectedStudent === '__all__') resultsViewMode = 'table'; // карта имеет смысл только для одного ученика

  const headerHtml = `
    <div class="row-2" style="margin-bottom:16px; align-items:end;">
      <div>
        <div class="field-label">Ученик</div>
        <select id="student-filter" onchange="onStudentFilterChange(this.value)">
          <option value="__all__" ${selectedStudent==='__all__'?'selected':''}>Все ученики (${list.length})</option>
          ${list.map(n=>`<option value="${escapeAttr(n)}" ${selectedStudent===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}
        </select>
        ${selectedStudent==='__all__' ? `<div style="font-size:12.6px; color:var(--muted); margin-top:6px;">Выберите имя ученика — результаты по задачам покажутся здесь</div>` : ''}
      </div>
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn" onclick="renderResultsTab()">Обновить данные</button>
        <button type="button" class="btn btn-sm" onclick="exportFullData(this)">Экспорт JSON</button>
        ${selectedStudent!=='__all__' ? `<button type="button" class="btn btn-sm" onclick="toggleResultsView()">${resultsViewMode==='map'?'Показать таблицей':'Показать по параграфам'}</button>` : ''}
        ${selectedStudent!=='__all__' && list.length > 1 ? `<button type="button" class="btn btn-sm" onclick="mergeStudent('${escapeAttr(selectedStudent)}')">Объединить с…</button>` : ''}
        ${selectedStudent!=='__all__' ? `<button type="button" class="btn btn-sm" style="color:var(--red);" onclick="deleteStudent('${escapeAttr(selectedStudent)}')">Удалить ученика</button>` : ''}
      </div>
    </div>
  `;

  /* ---------- "Все ученики": только сводка имя + время последнего ответа ---------- */
  if(selectedStudent === '__all__'){
    const summary = list.map(name=>{
      const data = allData[name] || {};
      let lastTs = 0;
      Object.keys(data).forEach(k=>{ if(data[k].ts > lastTs) lastTs = data[k].ts; });
      const gd = guidedResultsCache[name] || {};
      Object.keys(gd).forEach(q=>{ if((gd[q].touched || gd[q].color) && gd[q].ts > lastTs) lastTs = gd[q].ts; });
      return { name, lastTs };
    }).sort((a,b)=> b.lastTs - a.lastTs); // недавние сверху

    body.innerHTML = headerHtml + `
    <table>
      <thead><tr><th>Ученик</th><th style="white-space:nowrap;">Последний ответ</th></tr></thead>
      <tbody>
        ${summary.length ? summary.map(s=>`
          <tr class="summary-row" onclick="selectStudentFromSummary('${escapeAttr(s.name)}')">
            <td>${escapeHtml(s.name)}</td>
            <td style="white-space:nowrap;">${s.lastTs ? new Date(s.lastTs).toLocaleString('ru-RU', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—'}</td>
          </tr>`).join('') : `<tr><td colspan="2" style="text-align:center; color:var(--muted); padding:24px;">Пока нет ответов</td></tr>`}
      </tbody>
    </table>
    `;
    return;
  }

  /* ---------- Конкретный ученик: полная таблица по задачам ---------- */
  let rows = [];
  const data = allData[selectedStudent] || {};
  Object.keys(data).forEach(key=>{
    const isFollowUp = key.endsWith('-followup');
    const baseKey = isFollowUp ? key.slice(0, -('-followup'.length)) : key;
    const [par, num] = baseKey.split('-').map(Number);
    const meta = PAR_INDEX[par];
    const ak = answerKeyCache[dbId(par, num)];
    const correctAnswer = isFollowUp ? (ak ? ak.followUpAnswer : '') : (ak ? ak.answer : '');
    let followUpPending = false;
    if(!isFollowUp){
      const prob = (getParBlob(par) || {})[num];
      const hasFollowUp = !!(prob && prob.followUp && ((prob.followUp.text && prob.followUp.text.trim()) || (prob.followUp.images && prob.followUp.images.length) || (prob.followUp.wideImages && prob.followUp.wideImages.length)));
      const rec = data[key];
      const fuRec = data[followUpDataKey(key)];
      const everWrongOnMain = !!(rec && (!rec.correct || rec.attempts > 1));
      followUpPending = hasFollowUp && everWrongOnMain && !(fuRec && fuRec.correct);
    }
    rows.push({ name: selectedStudent, key: baseKey, dataKey: key, par, num, isFollowUp, title: meta ? meta.title : '', correctAnswer, followUpPending, ...data[key] });
  });

  // Профильный уровень: отдельные, упрощённые строки — только № и время,
  // раз там нет проверки ответа (её красит цветом учитель вручную).
  const guidedData = guidedResultsCache[selectedStudent] || {};
  Object.keys(guidedData).forEach(qid=>{
    const gp = guidedData[qid];
    if(!gp.touched && !gp.color) return; // ученик вообще не трогал — в таблицу не добавляем
    const [par, num] = qid.split('.').map(Number);
    const meta = PAR_INDEX[par];
    rows.push({ name: selectedStudent, key: pKey(par,num), dataKey: null, par, num, isFollowUp: false,
      title: meta ? meta.title : '', isGuided: true, guidedColor: gp.color, ts: gp.ts, attempts: null, correctAnswer: '', given: '' });
  });

  const dirMul = resultsSort.dir === 'asc' ? 1 : -1;
  if(resultsSort.field === 'task'){
    rows.sort((a,b)=> dirMul * ((a.par - b.par) || (a.num - b.num)));
  } else {
    rows.sort((a,b)=> dirMul * (a.ts - b.ts));
  }

  body.innerHTML = headerHtml + `
    ${resultsViewMode==='map' ? renderStudentMapHtml(selectedStudent) : `
    <table>
      <thead><tr>
        <th style="cursor:pointer; user-select:none; white-space:nowrap;" onclick="setResultsSort('task')">№ задачи ${sortArrow('task')}</th><th>Результат</th><th>Попыток</th><th style="cursor:pointer; user-select:none; white-space:nowrap;" onclick="setResultsSort('ts')">Когда ${sortArrow('ts')}</th><th>Правильный ответ</th><th>Ответы ученика</th>
      </tr></thead>
      <tbody>
        ${rows.length ? rows.map(r=> r.isGuided ? `
          <tr>
            <td class="mono" style="cursor:pointer; color:var(--blue); white-space:nowrap;" title="Профильный уровень — показать и оценить" onclick="showProblemPreview(${r.par},${r.num},'${escapeAttr(r.name)}')">№${taskLabel(r.par,r.num)} <span style="color:var(--muted); font-weight:600;">(проф.)</span></td>
            <td><span class="tag ${r.guidedColor||'touched-muted'}" style="cursor:pointer;" title="Показать и оценить" onclick="showProblemPreview(${r.par},${r.num},'${escapeAttr(r.name)}')">${r.guidedColor ? ({red:'Плохо',yellow:'Средне',green:'Хорошо'}[r.guidedColor]) : 'Приступил'}</span></td>
            <td class="mono">—</td>
            <td style="white-space:nowrap;">${new Date(r.ts).toLocaleString('ru-RU')}</td>
            <td class="mono">—</td>
            <td class="mono">—</td>
          </tr>` : `
          <tr>
            <td class="mono" style="cursor:pointer; color:var(--blue); white-space:nowrap;" title="Показать текст задачи" onclick="showProblemPreview(${r.par},${r.num},'${escapeAttr(r.name)}')">№${taskLabel(r.par,r.num)}${r.isFollowUp ? ` <span style="color:var(--blue); font-weight:600;">(доп.)</span>` : ''}</td>
            <td><span class="tag ${r.correct?((r.attempts>1)?'retry':'ok'):((r.given&&r.given.trim())?'bad':'touched-muted')} ${r.followUpPending?'result-task-pending':''}" style="cursor:pointer;" title="Показать текст задачи${r.followUpPending?' — есть нерешённая доп. задача':''}" onclick="showProblemPreview(${r.par},${r.num},'${escapeAttr(r.name)}')">${r.correct?'Верно':((r.given&&r.given.trim())?'Неверно':'Приступил')}</span></td>
            <td class="mono">${attemptsCellHtml(r)}</td>
            <td style="white-space:nowrap;">${new Date(r.ts).toLocaleString('ru-RU')}</td>
            <td class="mono">${escapeHtml(r.correctAnswer)}</td>
            <td class="mono">${answersListHtml(r.name, r.dataKey)}</td>
          </tr>`).join('') : `<tr><td colspan="6" style="text-align:center; color:var(--muted); padding:24px;">Пока нет ответов</td></tr>`}
      </tbody>
    </table>
    `}
  `;
}

/* Объединение двух записей одного ученика (например, имя написано по-разному):
   результаты выбранного ученика переносятся в другую запись, выбранная
   исчезает. Саму работу делает функция merge_students в базе. */
async function mergeStudent(name){
  const others = resultsCache.list.filter(n=>n!==name);
  if(!others.length) return;
  const listText = others.map((n,i)=>(i+1)+'. '+n).join('\n');
  const ans = await customPrompt('Результаты «'+name+'» будут перенесены в запись, которую вы выберете, а запись «'+name+'» исчезнет.\n\nВведите номер ученика, у которого оставить запись:\n'+listText);
  if(ans === null || String(ans).trim() === '') return;
  const idx = parseInt(String(ans).trim(), 10) - 1;
  if(!(idx >= 0 && idx < others.length)){ await customAlert('Нужно ввести номер из списка.'); return; }
  const target = others[idx];
  if(!await customConfirm('Объединить «'+name+'» → «'+target+'»? Запись «'+name+'» исчезнет, её результаты окажутся у «'+target+'». Это действие необратимо.')) return;
  const { error } = await sbRpc('merge_students', { p_password_hash: state.teacherPasswordHash, p_from: name, p_into: target });
  if(error){ await customAlert('Не удалось объединить: ' + (error.message || 'ошибка') + '\n\nПроверьте, что SQL «15-supabase-schema-addon-merge-students.sql» выполнен в Supabase.'); return; }
  await renderResultsTab();
  await customAlert('Готово: результаты «'+name+'» перенесены к «'+target+'».');
}

async function deleteStudent(name){
  if(!await customConfirm('Удалить ученика "'+name+'" вместе со всеми его результатами? Это действие необратимо.')) return;
  const { error } = await sbRpc('reset_student_progress', { p_password_hash: state.teacherPasswordHash, p_student_name: name });
  if(error){ await customAlert('Не удалось удалить ученика.'); return; }
  delete resultsCache.allData[name];
  resultsCache.list = resultsCache.list.filter(n=>n!==name);
  delete attemptsCache[name];
  drawResults('__all__');
}

/* Выгрузка полного JSON: вся база задач (со всеми параграфами, картинками,
   доп. задачами и эталонными ответами) + все результаты учеников — в одном
   файле. Задачи догружаются полностью (loadAllParBlobs), даже если учитель
   ещё не открывал часть параграфов в этой сессии. */
async function exportFullData(btn){
  const originalLabel = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; }
  try{
    if(btn) btn.textContent = 'Загружаем задачи...';
    await loadAllParBlobs(true, (done,total)=>{ if(btn) btn.textContent = `Загружаем задачи... ${done}/${total}`; });

    if(btn) btn.textContent = 'Загружаем ответы...';
    const { data: keyRows, error: kErr } = await sbRpcAll('get_teacher_answer_key', { p_password_hash: state.teacherPasswordHash });
    if(kErr){ await customAlert('Не удалось выгрузить эталонные ответы.'); return; }

    if(btn) btn.textContent = 'Загружаем результаты учеников...';
    const { data: summary, error: sErr } = await sbRpcAll('get_teacher_summary', { p_password_hash: state.teacherPasswordHash });
    if(sErr){ await customAlert('Не удалось выгрузить результаты учеников.'); return; }

    const answerMap = {};
    (keyRows||[]).forEach(r=>{ answerMap[r.question_id] = { answer: r.answer, followUpAnswer: r.follow_up_answer, solutionText: r.solution_text, followUpSolutionText: r.follow_up_solution_text, solutionImages: r.solution_images || [], followUpSolutionImages: r.follow_up_solution_images || [] }; });

    // ---- задачи ----
    const problems = [];
    for(let par=1; par<=TOTAL_PARS; par++){
      const blob = state.parBlobs[par] || {};
      Object.keys(blob).map(Number).sort((a,b)=>a-b).forEach(num=>{
        const id = dbId(par, num);
        const q = blob[num];
        const ak = answerMap[id] || {};
        const item = {
          par, num,
          text: q.text || '',
          images: q.images || [],
          wideImages: q.wideImages || [],
          answer: ak.answer ?? null,
          solution: ak.solutionText ?? null,
          solutionImages: ak.solutionImages || []
        };
        if(q.hintChain) item.hint_chain = q.hintChain; // наводящие вопросы (Повышенный уровень)
        if(q.followUp){
          item.followUp = {
            text: q.followUp.text || '',
            images: q.followUp.images || [],
            wideImages: q.followUp.wideImages || [],
            answer: ak.followUpAnswer ?? null,
            solution: ak.followUpSolutionText ?? null,
            solutionImages: ak.followUpSolutionImages || []
          };
        }
        problems.push(item);
      });
    }

    // ---- задачи Профильного уровня (таблица guided_questions) ----
    // Формат полей — как в файлах для import-profilny.js, поэтому их можно
    // загрузить обратно тем же способом (condition хранится вместе с
    // картинками слева в виде строк {{limg:...}}, как и в базе).
    const guidedProblems = [];
    for(let par=1; par<=TOTAL_PARS; par++){
      if(!isGuidedPar(par)) continue;
      const gb = getGuidedBlob(par);
      Object.keys(gb).map(Number).sort((a,b)=>a-b).forEach(num=>{
        const g = gb[num];
        guidedProblems.push({
          par, num,
          condition: joinCondition(g.condition, g.condLeft),
          cond_img: g.condImg || null,
          answer: g.answer || null,
          answer_img: g.answerImg || null,
          original: g.original || null,
          chains: g.chains || []
        });
      });
    }

    // ---- результаты учеников ----
    const students = {};
    (summary||[]).forEach(row=>{
      if(!students[row.student_name]) students[row.student_name] = [];
      students[row.student_name].push({
        questionId: row.question_id,
        isFollowUp: row.is_follow_up,
        attempts: row.attempts,
        solved: row.solved,
        solvedOnAttempt: row.solved_on_attempt,
        lastAnswer: row.last_answer,
        lastCorrect: row.last_correct,
        lastTimestamp: row.last_timestamp
      });
    });

    // ---- прогресс учеников по Профильному уровню ----
    if(btn) btn.textContent = 'Загружаем прогресс по профильным...';
    const { data: gRows } = await sbRpcAll('get_teacher_guided_progress', { p_password_hash: state.teacherPasswordHash });
    const guidedStudents = {};
    (gRows||[]).forEach(r=>{
      if(!guidedStudents[r.student_name]) guidedStudents[r.student_name] = [];
      guidedStudents[r.student_name].push({
        questionId: r.question_id,
        touched: !!r.touched,
        hintViewed: !!r.hint_viewed,
        color: r.color || null,
        lastTimestamp: r.last_timestamp || null
      });
    });

    const exportObj = {
      version: 2,
      exportedAt: new Date().toISOString(),
      parTitles: parTitleOverrides,
      problems,
      guidedProblems,
      students,
      guidedStudents
    };

    const fileBlob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(fileBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `phys_ege_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } finally {
    if(btn && document.body.contains(btn)){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}

/* Строка "Ответ ученика: ..." под соответствующей частью задачи (основной
   или дополнительной) — тот же визуальный язык (тег ok/retry/bad), что и в
   таблице результатов. rec — запись {given, correct, attempts} или null/undefined,
   если ученик эту часть ещё не решал. */
/* «Попыток» в progress.attempts = ответы + открытия указания (view_hint тоже
   увеличивает счётчик, но в историю attempts не пишет). Чтобы число не
   расходилось со списком ответов, показываем раздельно: ответов — по истории,
   указаний — остаток. */
function attemptsInfoText(studentName, key, rec){
  if(!rec || !rec.attempts) return '';
  const arr = (studentName && attemptsCache[studentName] && attemptsCache[studentName][key]) || null;
  if(!arr) return `попыток: ${rec.attempts}`;
  const hints = Math.max(0, rec.attempts - arr.length);
  if(!hints) return `попыток: ${arr.length}`;
  return `ответов: ${arr.length} · смотрел указания`;
}

function attemptsCellHtml(r){
  const arr = (attemptsCache[r.name] && attemptsCache[r.name][r.dataKey]) || [];
  const hints = Math.max(0, (r.attempts||0) - arr.length);
  if(!hints || !arr.length) return String(r.attempts);
  return `${arr.length}<span style="color:var(--muted,#888);font-size:11px;" title="Ученик смотрел указания"> + ук.</span>`;
}

function studentAnswerLineHtml(rec, studentName, key){
  if(!rec) return '';
  // Ученик открыл указание, но ответа не отправлял (given пустой) — не «Неверно», а «Приступил»
  if(!rec.correct && !(rec.given && String(rec.given).trim())){
    return `<div class="prev-answer"><span class="tag touched-muted">Приступил</span></div>`;
  }
  const cls = rec.correct ? ((rec.attempts>1)?'retry':'ok') : 'bad';
  const label = rec.correct ? 'Верно' : 'Неверно';
  return `<div class="prev-answer">Ответ ученика: <b>${escapeHtml(rec.given)}</b> <span class="tag ${cls}">${label}</span>${rec.attempts?` · ${attemptsInfoText(studentName, key, rec)}`:''}</div>`;
}

/* Полная история ВСЕХ ответов ученика по этой части задачи (не только
   последнего, как в строке выше) — используется в окне предпросмотра
   задачи, открываемом с карты прогресса ученика (и из таблицы результатов).
   Переиспользует answersListHtml (тот же формат "ответ1; ответ2; верный
   ответ жирным зелёным", что и в колонке "Ответы ученика" таблицы
   результатов) поверх attemptsCache — он уже загружен к этому моменту
   вкладкой "Результаты" (renderResultsTab грузит его вместе с summary и
   answer_key), поэтому дополнительного похода в Supabase не требуется. */
function studentAnswersHistoryHtml(studentName, key){
  const list = answersListHtml(studentName, key);
  if(!list) return '';
  return `<div class="prev-answer">Все ответы ученика: ${list}</div>`;
}

/* Окно задачи: листание стрелками ‹ › (и клавишами ← →) между задачами
   одного параграфа, не закрывая окно. previewCtx — что сейчас открыто. */
let previewCtx = null;

function updatePreviewNav(){
  const prev = document.getElementById('pp-prev'), next = document.getElementById('pp-next');
  if(!prev || !next) return;
  if(!previewCtx){ prev.disabled = next.disabled = true; return; }
  const nums = problemsForPar(previewCtx.par);
  const i = nums.indexOf(previewCtx.num);
  prev.disabled = !(i > 0);
  next.disabled = !(i >= 0 && i < nums.length - 1);
}

function previewStep(dir){
  if(!previewCtx) return;
  const nums = problemsForPar(previewCtx.par);
  const i = nums.indexOf(previewCtx.num);
  const target = nums[i + dir];
  if(i < 0 || target === undefined) return;
  showProblemPreview(previewCtx.par, target, previewCtx.studentName);
}

document.addEventListener('keydown', (e)=>{
  const ov = document.getElementById('problem-preview-overlay');
  if(!ov || !ov.classList.contains('open')) return;
  const dlg = document.getElementById('custom-dialog-overlay');
  if(dlg && dlg.style.display === 'flex') return;
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  if(e.key === 'ArrowLeft'){ e.preventDefault(); previewStep(-1); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); previewStep(1); }
  else if(e.key === 'Escape'){ closeProblemPreview(); }
});

async function showProblemPreview(par, num, studentName){
  previewCtx = { par, num, studentName };
  const overlay = document.getElementById('problem-preview-overlay');
  const titleEl = document.getElementById('problem-preview-title');
  const body = document.getElementById('problem-preview-body');
  titleEl.textContent = 'Задача ' + taskLabel(par, num) + (studentName ? ' — ' + studentName : '');
  body.innerHTML = `<p>Загрузка...</p>`;
  overlay.classList.add('open');

  if(isGuidedPar(par)){ await renderGuidedProblemPreviewBody(par, num, studentName); return; }

  await ensureParLoaded(par, false);
  if(!previewCtx || previewCtx.par !== par || previewCtx.num !== num) return; // успели перейти на другую задачу
  updatePreviewNav();
  const prob = (getParBlob(par) || {})[num];
  if(!prob){
    body.innerHTML = `<div class="placeholder-text">Не удалось найти эту задачу (возможно, она была удалена или перемещена).</div>`;
    return;
  }
  const meta = PAR_INDEX[par];
  const ak = teacherAnswerKeyCache[dbId(par, num)] || answerKeyCache[dbId(par, num)] || {};
  const studentData = (studentName && resultsCache && resultsCache.allData[studentName]) ? resultsCache.allData[studentName] : null;
  const baseKey = pKey(par, num);
  const studentMain = studentData ? studentData[baseKey] : null;
  const studentFollowUp = studentData ? studentData[followUpDataKey(baseKey)] : null;

  let html = `<div class="par-eyebrow">${escapeHtml(meta ? meta.title : '')}</div>`;
  html += problemPreviewPartHtml(prob, 'Задача ' + taskLabel(par, num), false);
  if(ak.answer){
    html += `<div class="prev-answer">Правильный ответ: <b>${escapeHtml(ak.answer)}</b></div>`;
  }
  html += solutionBoxHtml('Полное решение (видно только вам)', ak.solutionText, ak.solutionImages);
  if(isPovyshPar(par) && prob.hintChain && prob.hintChain.length){
    html += `<div class="prev-answer" style="margin-top:14px;"><b>Указания (наводящие вопросы)</b></div><div class="gc-preview" id="gc-preview-popup" style="margin-top:6px;">${renderGuidedChainsPreview(prob.hintChain, gcActiveTab['popup'] || 0)}</div>`;
  }
  if(studentName){
    html += studentAnswerLineHtml(studentMain, studentName, baseKey);
    html += studentAnswersHistoryHtml(studentName, baseKey);
  }
  if(prob.followUp){
    html += problemPreviewPartHtml(prob.followUp, 'Дополнительная задача к ' + taskLabel(par, num), true);
    if(ak.followUpAnswer){
      html += `<div class="prev-answer">Правильный ответ (доп. задача): <b>${escapeHtml(ak.followUpAnswer)}</b></div>`;
    }
    html += solutionBoxHtml('Полное решение доп. задачи (видно только вам)', ak.followUpSolutionText, ak.followUpSolutionImages);
    if(studentName){
      html += studentAnswerLineHtml(studentFollowUp, studentName, followUpDataKey(baseKey));
      html += studentAnswersHistoryHtml(studentName, followUpDataKey(baseKey));
    }
  }
  body.innerHTML = html;
}

function closeProblemPreview(){
  previewCtx = null;
  updatePreviewNav();
  document.getElementById('problem-preview-overlay').classList.remove('open');
}

/* Предпросмотр задачи Профильного уровня в том же модальном окне —
   вместо questions/parBlobs читаем guided_questions, вместо проверки
   ответа — три кнопки ручной оценки (red/yellow/green), связанные с
   guided_progress. */
async function renderGuidedProblemPreviewBody(par, num, studentName){
  const body = document.getElementById('problem-preview-body');
  await ensureGuidedParLoaded(par, false);
  if(!previewCtx || previewCtx.par !== par || previewCtx.num !== num) return; // успели перейти на другую задачу
  updatePreviewNav();
  const prob = getGuidedBlob(par)[num];
  if(!prob){
    body.innerHTML = `<div class="placeholder-text">Не удалось найти эту задачу (возможно, она была удалена или перемещена).</div>`;
    return;
  }
  const meta = PAR_INDEX[par];
  const qid = dbId(par, num);
  const gp = (studentName && guidedResultsCache[studentName]) ? guidedResultsCache[studentName][qid] : null;

  let html = `<div class="par-eyebrow">${escapeHtml(meta ? meta.title : '')}</div>`;
  html += `<div class="problem-card">${guidedConditionBodyHtml(prob)}</div>`;
  html += `<div class="prev-answer">Ответ: <b>${formatPhysicsText(prob.answer||'')}</b>${prob.answerImg?`<img src="${escapeAttr(prob.answerImg)}" style="max-width:100%;border-radius:8px;margin-top:8px;display:block">`:''}</div>`;
  { const o = splitOriginal(prob.original); html += solutionBoxHtml('Полное решение (видно только вам)', o.text, o.images); }
  if(prob.chains && prob.chains.length){
    // gc-preview — обязательная обёртка: по ней работает переключение вкладок
    // «Обоснование»/«Решение»; выбранная вкладка помнится при листании задач.
    html += `<div class="gc-preview" id="gc-preview-popup" style="margin-top:14px;">${renderGuidedChainsPreview(prob.chains, gcActiveTab['popup'] || 0)}</div>`;
  }

  if(studentName){
    const colors = [['red','Плохо'],['yellow','Средне'],['green','Хорошо']];
    html += `<div class="solution-box" style="margin-top:16px;">
      <div class="solution-label">Оценка для ${escapeHtml(studentName)}</div>
      <div style="display:flex; gap:8px; margin-top:8px; align-items:center;">
        ${colors.map(([c,label])=>`<button type="button" class="btn btn-sm gpv-color-btn" style="${gp&&gp.color===c?`background:var(--${c==='yellow'?'amber':c});color:#fff;border-color:var(--${c==='yellow'?'amber':c});`:''}" onclick="setGuidedColorFromPreview('${qid}','${escapeAttr(studentName)}','${c}',${par},${num})">${label}</button>`).join('')}
        <span style="font-size:12.6px; color:var(--muted); margin-left:6px;">
          ${gp && gp.hintViewed ? 'Ученик открывал подсказки' : 'Подсказки не открывал'}${gp && gp.touched ? ' · приступил' : ''}
        </span>
      </div>
    </div>`;
  }

  body.innerHTML = html;
}

async function setGuidedColorFromPreview(qid, studentName, color, par, num){
  const current = (guidedResultsCache[studentName] || {})[qid];
  const newColor = (current && current.color === color) ? 'none' : color;
  const { error } = await sbRpc('set_guided_progress', {
    p_password_hash: state.teacherPasswordHash,
    p_student_name: studentName,
    p_question_id: qid,
    p_color: newColor
  });
  if(error){ await customAlert('Не удалось сохранить оценку: ' + error.message); return; }
  if(!guidedResultsCache[studentName]) guidedResultsCache[studentName] = {};
  if(!guidedResultsCache[studentName][qid]) guidedResultsCache[studentName][qid] = { touched:true, hintViewed:false, color:null, ts:Date.now() };
  guidedResultsCache[studentName][qid].color = newColor === 'none' ? null : newColor;
  await renderGuidedProblemPreviewBody(par, num, studentName);
}
</script>
<style>
.lint-box{margin:4px 0 8px; padding:6px 10px; border:1px solid #e0b84a; background:#fff8e1; color:#6b4e00; border-radius:8px; font-size:13px; line-height:1.4;}
.lint-box b{font-weight:600;}
.lint-box ul{margin:2px 0 0 16px; padding:0;}
.lint-box code{background:rgba(0,0,0,.07); padding:0 3px; border-radius:3px; font-size:12px; white-space:pre-wrap;}
.lint-ok{display:none;}
@media (prefers-color-scheme: dark){ .lint-box{background:#3a3115; border-color:#8a7020; color:#f1d98a;} }
</style>
<script>
/* Проверка опечаток и разметки в окнах редактирования учителя.
   1) Включает проверку орфографии браузера (русский словарь) в текстовых полях.
   2) Под полем показывает предупреждения: незакрытые скобки/теги, дроби с одной
      группой, смесь кириллицы и латиницы в слове, лишние/недостающие пробелы,
      повтор слова. Это только подсказки — сохранению не мешают. */
(function(){
  const SKIP_ID = /^(answer-|new-answer|ganswer-|fu-answer-|gate-|par-title|answer-input|followup-answer-input)/;
  function snip(t, i, len){
    const a = Math.max(0, i-14), b = Math.min(t.length, i+(len||1)+14);
    return (a?'…':'') + t.slice(a,b).replace(/\n/g,'↵') + (b<t.length?'…':'');
  }
  function lintText(t){
    const out = [];
    const add = (msg, i, len) => out.push(msg + (i!=null ? ': <code>'+esc(snip(t,i,len))+'</code>' : ''));
    // 1. фигурные скобки
    let depth = 0, firstOpen = -1;
    for(let i=0;i<t.length;i++){
      if(t[i]==='{'){ if(depth===0) firstOpen=i; depth++; }
      else if(t[i]==='}'){ depth--; if(depth<0){ add('Лишняя закрывающая <b>}</b>', i); depth=0; } }
    }
    if(depth>0) add('Не закрыта <b>{</b> ('+depth+' шт.)', firstOpen);
    // 2. блочные теги
    ['table','cols','sys'].forEach(tag=>{
      const o = (t.match(new RegExp('\\['+tag+'\\]','g'))||[]).length;
      const c = (t.match(new RegExp('\\[/'+tag+'\\]','g'))||[]).length;
      if(o!==c) add(o>c ? 'Не закрыт тег <b>[/'+tag+']</b>' : 'Лишний <b>[/'+tag+']</b> без открывающего', null);
    });
    // 3. дробь /{a} без второй группы
    const fr = /\/\{/g; let m;
    while((m = fr.exec(t))){
      let d=0, j=m.index+1;
      for(; j<t.length; j++){ if(t[j]==='{') d++; else if(t[j]==='}'){ d--; if(d===0) break; } }
      if(j<t.length && t[j+1] !== '{') add('Дробь <b>/{…}</b> без знаменателя (нужно /{числитель}{знаменатель})', m.index, j-m.index+2);
    }
    // 4. ^ и _ без аргумента
    const sc = /\^(?![{A-Za-zА-Яа-я0-9])|(?<!_)_(?![_{A-Za-zА-Яа-я0-9])/g; // серия подчёркиваний ____ (пропуск) — не ошибка
    while((m = sc.exec(t))) add('После <b>'+m[0]+'</b> нет индекса/степени', m.index, 2);
    // 5. смесь раскладок в слове (кириллица + латиница), только вне разметки
    const plain = t.replace(/\[(?:\/)?(?:table|cols|sys|break)\]/g,' ');
    const mix = /[A-Za-zА-Яа-яЁё]{3,}/g;
    while((m = mix.exec(plain))){
      const w = m[0];
      if(/[А-Яа-яЁё]/.test(w) && /[A-Za-z]/.test(w)) add('Смесь русских и латинских букв в слове «'+esc(w)+'»', t.indexOf(w), w.length);
    }
    // 6. пробелы и пунктуация
    const sp = /([^\S\n]{2,})(?=\S)/g;
    if(/[А-Яа-яЁё\w][ ]{2,}[А-Яа-яЁё\w]/.test(t)){ const i=t.search(/[А-Яа-яЁё\w][ ]{2,}[А-Яа-яЁё\w]/); add('Двойной пробел', i, 4); }
    let i1 = t.search(/[А-Яа-яЁё\w\)] [,.;:!?](?!\.)(?=\s|$)/);
    if(i1>=0) add('Пробел перед знаком препинания', i1, 3);
    i1 = t.search(/[А-Яа-яЁё]{2},[А-Яа-яЁё]/);
    if(i1>=0) add('Нет пробела после запятой', i1, 4);
    i1 = t.search(/[А-Яа-яЁё]{2}\.[А-Я]/);
    if(i1>=0) add('Нет пробела после точки', i1, 4);
    // 7. повтор слова
    const rep = /(^|[^А-Яа-яЁё])([А-Яа-яЁё]{1,})\s+\2(?![А-Яа-яЁё])/i;
    m = rep.exec(t);
    if(m) add('Повтор слова «'+esc(m[2])+'»', m.index, m[0].length);
    return out.slice(0,6);
  }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function box(el){
    let b = el.nextElementSibling;
    if(!(b && b.classList && b.classList.contains('lint-box'))){
      b = document.createElement('div'); b.className = 'lint-box lint-ok';
      el.parentNode.insertBefore(b, el.nextSibling);
    }
    return b;
  }
  function run(el){
    const res = lintText(el.value||'');
    const b = box(el);
    if(!res.length){ b.className='lint-box lint-ok'; b.innerHTML=''; return; }
    b.className='lint-box';
    b.innerHTML = '<b>Возможные опечатки:</b><ul>'+res.map(r=>'<li>'+r+'</li>').join('')+'</ul>';
  }
  function eligible(el){
    if(!el || !el.closest) return false;
    if(el.tagName==='TEXTAREA') return true;
    return false;
  }
  document.addEventListener('focusin', e=>{
    const el = e.target;
    if(el && el.tagName==='INPUT' && el.type==='text' && !SKIP_ID.test(el.id||'') && el.closest('#teacher-overlay')){
      el.setAttribute('spellcheck','true'); el.setAttribute('lang','ru'); return;
    }
    if(!eligible(el)) return;
    el.setAttribute('spellcheck','true'); el.setAttribute('lang','ru');
    run(el);
  });
  let timer;
  document.addEventListener('input', e=>{
    const el = e.target;
    if(!eligible(el)) return;
    clearTimeout(timer); timer = setTimeout(()=>run(el), 300);
  });
})();
</script>
<script>
/* Предупреждение о несохранённых изменениях при закрытии панели учителя.
   Снимок значений полей берётся после каждой отрисовки вкладки; при «Закрыть ✕»
   текущие значения сравниваются со снимком. Если что-то изменено — спрашиваем:
   «Сохранить» / «Не сохранять» / «Отмена». */
(function(){
  const IMG_KEYS = ['images','wideImages','solutionImages','fuImages','fuWideImages','fuSolutionImages'];
  let base = null, touched = false;
  function fieldEls(){
    const body = document.getElementById('tm-body');
    if(!body) return [];
    return Array.from(body.querySelectorAll('textarea[id], input[id]'))
      .filter(el=>!/^(url-input-|par-select)/.test(el.id) && el.type!=='file' && el.type!=='button');
  }
  function draftsJson(key){
    try{
      const d = (typeof teacherDrafts!=='undefined' && teacherDrafts[key]) || {};
      return JSON.stringify(IMG_KEYS.map(k=>d[k]||[]));
    }catch(e){ return ''; }
  }
  function takeSnapshot(){
    const fields = {};
    fieldEls().forEach(el=>{ fields[el.id] = el.type==='checkbox' ? String(el.checked) : el.value; });
    const drafts = {};
    try{ Object.keys(teacherDrafts||{}).forEach(k=>{ drafts[k] = draftsJson(k); }); }catch(e){}
    return {fields, drafts};
  }
  function setBase(){ base = takeSnapshot(); touched = false; }
  function isDirty(){
    if(!base) return false;
    const now = takeSnapshot();
    for(const id in now.fields){ if(id in base.fields && base.fields[id] !== now.fields[id]) return true; }
    for(const k in now.drafts){ if(k in base.drafts && base.drafts[k] !== now.drafts[k]) return true; }
    return false;
  }
  // снимок после каждой отрисовки (плюс повторный через 0,5 с, если ещё ничего не вводили —
  // на случай, если поля дозаполняются после отрисовки)
  function wrapAfter(name){
    const orig = window[name];
    if(typeof orig !== 'function') return;
    window[name] = function(){
      const r = orig.apply(this, arguments);
      const done = ()=>{ setBase(); setTimeout(()=>{ if(!touched) setBase(); }, 500); };
      if(r && typeof r.then==='function') return r.then(v=>{ done(); return v; });
      done(); return r;
    };
  }
  ['drawProblemsTab','drawGuidedProblemsTab','renderResultsTab'].forEach(wrapAfter);
  // успешное сохранение одной задачи без перерисовки — обновить снимок по её полям
  (function(){
    const orig = window.saveProblem;
    if(typeof orig !== 'function') return;
    window.saveProblem = async function(key){
      const ok = await orig.apply(this, arguments);
      if(ok && base){
        fieldEls().forEach(el=>{ if(el.id.endsWith('-'+key)) base.fields[el.id] = el.value; });
        base.drafts[key] = draftsJson(key);
      }
      return ok;
    };
  })();
  document.addEventListener('input', e=>{
    if(e.target && e.target.closest && e.target.closest('#tm-body')) touched = true;
  });

  function askUnsaved(){
    return new Promise(resolve=>{
      const overlay = document.getElementById('custom-dialog-overlay');
      const msgEl = document.getElementById('custom-dialog-message');
      const inputEl = document.getElementById('custom-dialog-input');
      const btnsEl = document.getElementById('custom-dialog-buttons');
      msgEl.textContent = 'В окне редактирования есть несохранённые изменения. Сохранить их перед закрытием?';
      inputEl.style.display = 'none';
      btnsEl.innerHTML = '';
      const mk = (label, cls, val)=>{
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'btn '+cls+' btn-sm'; b.textContent = label;
        b.onclick = ()=>{ overlay.style.display='none'; resolve(val); };
        btnsEl.appendChild(b);
      };
      mk('Отмена','btn-ghost','cancel');
      mk('Не сохранять','btn-ghost','discard');
      mk('Сохранить','btn-dark','save');
      overlay.style.display = 'flex';
    });
  }
  const hide = ()=>document.getElementById('teacher-overlay').classList.remove('open');
  let closing = false;
  // true — можно продолжать (правок нет / «Не сохранять» / сохранено успешно);
  // false — остаёмся в окне («Отмена» или сохранить не удалось).
  async function guardUnsaved(){
    if(!isDirty()) return true;
    if(closing) return false;
    closing = true;
    try{
      const ans = await askUnsaved();
      if(ans === 'cancel') return false;
      if(ans === 'discard'){ base = null; return true; }
      if(typeof isGuidedPar==='function' && isGuidedPar(teacherSelectedPar)){
        const b = document.querySelector('.guided-saveall-bar .btn');
        if(b) await saveAllGuidedProblems(b);
      } else if(document.getElementById('save-all-btn')){
        await saveAllProblems();
      } else {
        await customAlert('Нажмите «Добавить» / «Сохранить» в самой форме, затем повторите.');
        return false;
      }
      return !isDirty();
    } finally { closing = false; }
  }
  window.closeTeacher = async function(){
    if(await guardUnsaved()) hide();
  };
  window.changeTeacherPar = async function(sel){
    const val = parseInt(sel.value), prev = teacherSelectedPar;
    if(!(await guardUnsaved())){ try{ sel.value = String(prev); }catch(e){} return; }
    teacherSelectedPar = val; insertAfterNum = null; renderProblemsTab();
  };
  (function(){
    const orig = window.switchTab;
    if(typeof orig !== 'function') return;
    window.switchTab = async function(tab){
      if(!(await guardUnsaved())) return;
      return orig.apply(this, arguments);
    };
  })();
  window.addEventListener('beforeunload', e=>{
    const ov = document.getElementById('teacher-overlay');
    if(ov && ov.classList.contains('open') && isDirty()){ e.preventDefault(); e.returnValue = ''; }
  });
})();
</script>
