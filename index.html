<style>
  :root{
    --bg:#F4F6F8;
    --surface:#FFFFFF;
    --sidebar:#16213E;
    --sidebar-2:#20305A;
    --sidebar-3:#2A3D6E;
    --ink:#1A1F2B;
    --muted:#6B7280;
    --amber:#E8A33D;
    --amber-soft:#FBF0DD;
    --blue:#2F6FED;
    --blue-soft:#E9F0FE;
    --green:#2E9E5B;
    --green-soft:#E5F6EC;
    --red:#D64550;
    --red-soft:#FCE9EA;
    --border:#E3E7EC;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  #app{display:flex; height:100vh; overflow:hidden;}

  /* ---------- HEADER ---------- */
  #header{
    position:fixed; top:0; left:0; right:0; height:64px;
    background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; z-index:50;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-title{font-weight:700; font-size:20.3px; letter-spacing:-0.02em;}
  .brand-wave{display:block;}
  .header-right{display:flex; align-items:center; gap:10px;}
  .profile-chip{
    display:flex; align-items:center; gap:8px;
    background:var(--blue-soft); color:var(--blue);
    padding:6px 12px; border-radius:20px; font-weight:600; font-size:14.3px;
  }
  .profile-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);}
  .btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:15.6px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    padding:8px 14px; border-radius:8px; cursor:pointer; transition:.15s;
  }
  .btn:hover{border-color:var(--sidebar-3); background:var(--bg);}
  .btn-dark{background:var(--sidebar); color:#fff; border-color:var(--sidebar);}
  .btn-dark:hover{background:var(--sidebar-2);}
  .btn-amber{background:var(--amber); color:#1A1200; border-color:var(--amber);}
  .btn-amber:hover{filter:brightness(1.05);}
  .btn-green{background:var(--green); color:#fff; border-color:var(--green);}
  .btn-red{background:var(--red); color:#fff; border-color:var(--red);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--muted);}
  .btn-ghost:hover{background:var(--bg); color:var(--ink);}
  .btn-sm{padding:5px 10px; font-size:14.6px; border-radius:6px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  #hamburger{display:none;}

  /* ---------- SIDEBAR ---------- */
  #sidebar{
    width:394px; min-width:394px; background:var(--sidebar); color:#CBD3E8;
    margin-top:64px; height:calc(100vh - 64px); overflow-y:auto;
    padding:14px 10px 40px;
  }
  #sidebar::-webkit-scrollbar{width:8px;}
  #sidebar::-webkit-scrollbar-thumb{background:var(--sidebar-3); border-radius:4px;}
  .sec-block{margin-bottom:4px;}
  .sec-head{
    display:flex; align-items:center; gap:8px; padding:10px 10px;
    cursor:pointer; border-radius:8px; font-weight:700; font-size:14.8px;
    color:#fff; letter-spacing:.01em; text-transform:uppercase;
  }
  .sec-head:hover{background:var(--sidebar-2);}
  .caret{width:9px; height:9px; border-right:2px solid #8592B8; border-bottom:2px solid #8592B8; transform:rotate(-45deg); transition:.15s; flex-shrink:0;}
  .caret.open{transform:rotate(45deg);}
  .sub-list{padding-left:10px; overflow:hidden; max-height:0; transition:max-height .2s ease;}
  .sub-list.open{max-height:4000px;}
  .sub-head{
    display:flex; align-items:flex-start; gap:8px; padding:8px 10px; margin-top:2px;
    cursor:pointer; border-radius:7px; font-weight:600; font-size:14.1px; color:#B7C0DE;
  }
  .sub-head:hover{background:var(--sidebar-2); color:#fff;}
  .sub-head .caret{margin-top:4px;}
  .sub-head-text{flex:1; min-width:0;}
  .par-list{padding-left:14px; overflow:hidden; max-height:0; transition:max-height .2s ease;}
  .par-list.open{max-height:6000px;}
  .par-row{
    padding:5px 10px; margin-top:0; border-radius:6px; cursor:pointer;
    font-size:13.6px; color:#93A0C6; line-height:1.35; display:flex; gap:6px;
  }
  .par-row:hover{background:var(--sidebar-2); color:#EAEEFA;}
  .par-num{font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--amber); flex-shrink:0;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; padding:0 10px 0 24px; overflow:hidden; max-height:0; transition:max-height .2s ease, padding .2s ease;}
  .chips.open{max-height:2000px; padding:6px 10px 10px 24px;}
  .chip{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12.8px;
    min-width:34px; height:30px; padding:0 6px; display:flex; align-items:center; justify-content:center;
    border-radius:7px; cursor:pointer; background:var(--sidebar-2); color:var(--blue);
    border:1.5px solid #3A4E82; transition:.12s;
  }
  .chip.correct{color:#fff; background:var(--green); border-color:var(--green);}
  .chip.retry{color:#1A1200; background:var(--amber); border-color:var(--amber);}
  .chip.wrong{color:#fff; background:var(--red); border-color:var(--red);}
  .chip.active{outline:2px solid var(--amber); outline-offset:1px;}
  .chip.followup-pending{border-color:var(--blue); box-shadow:0 0 0 2px var(--blue);}
  .result-task-pending{display:inline-block; padding:2px 8px; border-radius:6px; border:1.5px solid var(--blue); box-shadow:0 0 0 2px var(--blue);}
  .chip:hover{filter:brightness(1.15);}
  .chip-empty{font-size:12.8px; color:#6E7BA0; padding:2px 10px 8px 24px; font-style:italic;}
  .sub-par-range{font-family:'JetBrains Mono',monospace; font-size:12.6px; font-weight:600; color:#6E7BA0; margin-left:4px; white-space:nowrap;}

  /* ---------- IMAGES ---------- */
  .img-gallery{display:flex; flex-wrap:wrap; gap:10px; margin:10px 0;}
  .img-gallery img{max-width:100%; max-height:340px; border-radius:10px; border:1px solid var(--border); display:block;}
  .img-thumb-wrap{position:relative; display:inline-block;}
  .img-thumb{width:90px; height:90px; object-fit:cover; border-radius:8px; border:1px solid var(--border); display:block;}
  .img-thumb-remove{
    position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
    background:var(--red); color:#fff; border:2px solid var(--surface); cursor:pointer;
    font-size:13.3px; line-height:1; display:flex; align-items:center; justify-content:center; font-weight:700;
  }
  .insert-badge{background:var(--amber); color:#1A1200; border-radius:8px; padding:8px 12px; font-size:13.8px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between;}

  /* ---------- MAIN ---------- */
  #main{flex:1; margin-top:64px; height:calc(100vh - 64px); overflow-y:auto;}
  .main-inner{max-width:880px; margin:0 auto; padding:36px 28px 80px;}

  .empty-state{text-align:center; padding:80px 20px; color:var(--muted);}
  .wave-big{opacity:.5; margin-bottom:14px;}

  .par-eyebrow{font-family:'JetBrains Mono',monospace; color:var(--blue); font-weight:700; font-size:14.3px; margin-bottom:6px;}
  .problem-title{font-size:22.6px; font-weight:700; margin:0 0 20px; letter-spacing:-0.01em;}
  .problem-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:20px; margin-bottom:20px;
  }
  .problem-body{gap:18px;}
  .problem-body::after{content:""; display:table; clear:both;}
  .problem-media{float:left; width:40%; max-width:300px; margin:0 18px 14px 0; display:flex; flex-direction:column; gap:10px;}
  .problem-wide-media{margin-top:14px; display:flex; flex-direction:column; gap:10px;}
  .problem-wide-media img{max-width:100%; border-radius:10px; border:1px solid var(--border); display:block; margin:0 auto;}
  .problem-media img{max-width:100%; border-radius:10px; border:1px solid var(--border); display:block; margin:0 auto;}
  .problem-text-col{padding-right:2px;}
  @media(max-width:700px){
    .problem-media{float:none; width:100%; max-width:100%; margin:0 0 14px 0;}
  }
  .problem-text{font-size:19.4px; line-height:1.35; white-space:pre-wrap; font-family:'Old Standard TT', 'Playfair Display', 'STIX Two Math', 'Times New Roman', serif;}
  .problem-text i{font-style:italic; font-family:'Old Standard TT', 'Playfair Display', 'STIX Two Math', 'Times New Roman', serif;}
  .cm-num{font-family:'Old Standard TT', 'Playfair Display', 'STIX Two Math', 'Times New Roman', serif; font-style:normal;}
  .vec-wrap{position:relative; display:inline-block; padding-top:0.28em; font-style:italic; font-family:'Old Standard TT', 'Playfair Display', 'STIX Two Math', 'Times New Roman', serif;}
  .overline{text-decoration:overline; text-decoration-thickness:1.3px; text-underline-offset:2px;}
  /* Знак корня — растягивающийся SVG-«крючок» вместо символа шрифта √.
     Символ шрифта не умеет растягиваться по высоте под произвольное
     содержимое (дробь под корнем, вложенные корни и т.п.) — приходилось
     подбирать отдельный увеличенный размер под "высокое" содержимое
     (класс sqrt-tall), и всё равно результат плыл на вложенных случаях.
     SVG с preserveAspectRatio="none" и height:100% растягивается ровно
     под высоту .sqrt-content на любом уровне вложенности без отдельных
     вариантов. Схема (см. также детальный разбор в заметках проекта):
       .sqrt-wrap — position:relative, а НЕ flex — высота крючка считается
         через position:absolute+height:100% от родителя, не через
         flex-stretch (flex-stretch у <svg> может конфликтовать с его
         внутренним соотношением сторон и давать нестабильную высоту).
       .sqrt-content — display:block с явным line-height — блочный элемент
         не зависит от vertical-align/leading строчной модели, поэтому
         верхний край всегда точно совпадает с верхом крючка. */
  .sqrt-wrap{position:relative; display:inline-block; padding-left:0.5em; white-space:nowrap;}
  .sqrt-hook{position:absolute; left:0; top:0; width:0.5em; height:100%; display:block; color:currentColor; pointer-events:none;}
  /* Знак корня как в обычной печати: короткий «хвостик», жирный спуск и длинная
     тонкая линия вверх до черты. Хвостик со спуском (.sqrt-foot) имеют фиксированный
     размер и прижаты к низу; растягивается по высоте только длинная линия (.sqrt-long). */
  .sqrt-foot{position:absolute; left:0; bottom:1px; width:0.3em; height:1.05em;}
  .sqrt-long{position:absolute; left:0.2em; top:0.04em; bottom:1px; width:0.3em;}
  .sqrt-hook svg{display:block; width:100%; height:100%; overflow:visible;}
  .sqrt-hook path{fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke;}
  .sqrt-hook .sq-thin{stroke-width:1.4px;}
  .sqrt-hook .sq-thick{stroke-width:2.6px;}
  /* Индекс корня произвольной степени (кнопка "ⁿ√" вставляет ^{n}√{...} —
     обычный верхний индекс сразу перед корнем). Где браузер поддерживает
     :has(), слегка приподнимаем и уменьшаем такую цифру, сближая её с
     радикалом, чтобы получалось похоже на настоящий ⁿ√ — в остальных
     браузерах индекс просто остаётся обычным верхним индексом перед знаком
     корня, что тоже читается корректно. */
  sup:has(+ .sqrt-wrap){font-size:0.62em; margin-right:-0.1em; position:relative; top:-0.15em;}
  .sys-wrap{display:flex; align-items:stretch; gap:8px; margin:6px 0;}
  .sys-brace-svg{width:14px; height:auto; flex-shrink:0; color:currentColor;}
  .sys-lines{display:flex; flex-direction:column; justify-content:center; gap:5px; padding:1px 0;}
  .sys-line{line-height:1.15;}
  .bracket-wrap{display:inline-flex; align-items:center; white-space:nowrap;}
  .bracket-char{font-family:'Old Standard TT','Playfair Display','STIX Two Math','Times New Roman',serif; font-style:normal; line-height:1; display:inline-block;}
  .bracket-content{margin:0 1px;}
  .pow-group{display:inline-flex; align-items:flex-start; vertical-align:middle;}
  .pow-group > .bracket-wrap{flex:none;}
  .pow-group > sup.sup-top{font-size:0.7em; line-height:1; margin-left:1px; margin-top:0.1em; vertical-align:baseline; position:static;}
  .bracket-tall .bracket-char{display:inline-block; transform:scaleY(1.55); font-size:1.05em;}
  .problem-text sup, .problem-text sub{font-size:0.7em;}
  .frac{display:inline-grid; grid-template-rows:1fr 1fr; vertical-align:middle; margin:0 3px; line-height:1.2; font-size:0.85em; text-align:center;}
  .frac-num{align-self:end; padding:0 2px 1px;}
  .frac-den{align-self:start; padding:1px 2px 0; border-top:0.06em solid currentColor;}
  .nuclide-pre{display:inline-flex; flex-direction:column; align-items:flex-end; justify-content:center; font-size:0.62em; line-height:1.05; vertical-align:middle; margin-right:1px; font-style:normal;}
  .upright-fn{font-style:normal;}
  .sqrt-content{border-top:0.075em solid currentColor; padding:1px 3px 0 3px; line-height:1.15; display:block;}
  .prob-table{border-collapse:collapse; margin:10px 0;}
  .prob-table td{border:1px solid var(--border); padding:6px 12px; text-align:center;}
  .two-col{column-count:2; column-gap:24px; margin:10px 0 4px;}
  .two-col-item{break-inside:avoid; -webkit-column-break-inside:avoid; margin-bottom:6px;}
  .two-col-manual{display:flex; gap:24px; margin:10px 0 4px;}
  .two-col-manual-part{flex:1; min-width:0;}
  .two-col-manual-part .two-col-item{margin-bottom:6px;}
  @media(max-width:520px){
    .two-col{column-count:1;}
    .two-col-manual{flex-direction:column; gap:0;}
  }
  .vec-arrow{position:absolute; top:0.03em; left:50%; transform:translateX(-50%) scale(0.6); line-height:1; font-style:normal;}
  /* Вектор над высокой буквой (заглавные и буквы с выносными элементами b d f h k l) — стрелку поднимаем, чтобы не касалась буквы. Величина подъёма — здесь. */
  .vec-cap .vec-arrow{margin-top:-0.14em;}
  .placeholder-text{color:var(--muted); font-style:italic;}
  .no-select{user-select:none; -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none;}
  .answer-row{display:flex; gap:10px; margin-top:8px;}
  .answer-input{
    flex:1; padding:12px 14px; border-radius:10px; border:1.5px solid var(--border);
    font-family:'JetBrains Mono',monospace; font-size:17.6px; outline:none; transition:.15s;
  }
  .answer-input:focus{border-color:var(--blue);}
  .feedback{margin-top:14px; padding:12px 16px; border-radius:10px; font-weight:600; font-size:16.6px; display:none;}
  .feedback.correct{display:block; background:var(--green-soft); color:var(--green);}
  .feedback.retry{display:block; background:var(--amber-soft); color:#9A6A15;}
  .feedback.wrong{display:block; background:var(--red-soft); color:var(--red);}
  .feedback.touched{display:block; background:#E7EAF0; color:#5A6678;}
  .prev-answer{margin-top:10px; font-size:15.1px; color:var(--muted);}
  .followup-trigger{margin-top:14px;}
  .followup-card{
    background:var(--surface); border:1px solid var(--amber); border-radius:14px;
    padding:20px; margin-top:16px;
  }
  .followup-card .par-eyebrow{color:#9A6A15;}
  .problem-card,.followup-card{position:relative;}
  .copy-img-btn{position:absolute; top:12px; right:12px; z-index:2;}
  .nobr{white-space:nowrap;}
  .problem-label{font-family:'JetBrains Mono',monospace; color:#1B3B87; font-weight:700; font-size:14.6px; text-transform:uppercase; letter-spacing:.03em; margin-bottom:10px;}
  .followup-label{font-family:'JetBrains Mono',monospace; color:#9A6A15; font-weight:700; font-size:14.6px; text-transform:uppercase; letter-spacing:.03em; margin-bottom:10px;}
  .followup-editor{margin-top:14px; padding-top:14px; border-top:1px dashed var(--border);}

  /* ---------- PROFILE GATE ---------- */
  #gate{
    position:fixed; inset:0; background:var(--sidebar); display:flex; align-items:center; justify-content:center; z-index:200;
  }
  .gate-card{background:var(--surface); border-radius:18px; padding:44px 40px; width:380px; max-width:90vw; text-align:center;}
  .gate-card h2{margin:0 0 6px; font-size:15.8px;}
  .gate-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:23.3px; letter-spacing:-0.01em; color:var(--ink); margin-bottom:18px; padding-bottom:18px; border-bottom:1px solid var(--border);}
  .gate-card p{color:var(--muted); font-size:14.8px; margin:0 0 22px;}
  .gate-card input{
    width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--border);
    font-size:16.3px; margin-bottom:14px; font-family:'Inter',sans-serif;
  }
  .gate-card .btn{width:100%; padding:12px;}
  .author-info{margin-top:18px; padding-top:16px; border-top:1px solid var(--border); text-align:center; font-size:12.8px; color:var(--muted); line-height:1.7;}
  .author-info .author-name{font-weight:700; color:var(--ink); font-size:13.8px; display:block; margin-bottom:4px;}
  .author-info a{color:var(--ink); text-decoration:none; font-weight:600;}
  .author-info .author-links{display:flex; gap:10px; justify-content:center; margin-top:2px;}
  .author-link{
    display:flex; align-items:center; justify-content:center; gap:7px; padding:8px 13px; border-radius:10px;
    border:1.5px solid var(--border); transition:.15s; width:138px;
  }

  .field-label{font-size:14.6px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin:0 0 6px;}

  .solution-details > summary::-webkit-details-marker{display:none;}
  .solution-details-caret{margin-left:auto; font-size:16.5px; color:var(--muted); flex-shrink:0; transition:transform .15s;}

  select, textarea, input[type=text], input[type=number], input[type=password]{
    font-family:'Inter',sans-serif; font-size:16.6px; padding:10px 12px; border-radius:8px;

  textarea{resize:vertical; min-height:70px; font-family:'JetBrains Mono',monospace; font-size:16.1px;}
  .formula-toolbar{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px;}
  .formula-btn{
    font-family:'JetBrains Mono',monospace; font-size:15.6px; font-weight:600;
    min-width:26px; height:26px; padding:0 6px; border-radius:6px;
    border:1px solid var(--border); background:var(--bg); color:var(--ink); cursor:pointer;
  }
  .formula-btn:hover{background:var(--blue-soft); border-color:var(--blue); color:var(--blue);}

  .row-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  .plist-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .plist-key{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--blue); font-size:15.6px;}
  table{width:100%; border-collapse:collapse; font-size:15.6px; background:var(--surface); border-radius:10px; overflow:hidden;}
  th,td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--border);}
  th{background:var(--bg); font-size:14.1px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted);}
  .tag{padding:3px 9px; border-radius:20px; font-size:14.1px; font-weight:700;}
  .tag.ok{background:var(--green-soft); color:var(--green);}
  .tag.retry{background:var(--amber-soft); color:#9A6A15;}
  .tag.bad{background:var(--red-soft); color:var(--red);}
  .tag.pending{background:var(--blue-soft); color:var(--blue);}
  .summary-row{cursor:pointer;}
  .summary-row:hover{background:var(--bg);}
  .stat-strip{display:flex; gap:10px; margin-bottom:16px;}
  .stat-box{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 16px; flex:1;}
  .stat-num{font-family:'Space Grotesk',sans-serif; font-size:24.6px; font-weight:700;}
  .stat-lbl{font-size:14.1px; color:var(--muted); text-transform:uppercase; letter-spacing:.02em;}
  .hint-box{background:var(--blue-soft); color:#1B3B87; border-radius:10px; padding:12px 14px; font-size:15.1px; line-height:1.55; margin-bottom:16px;}
  .hint-box code{background:rgba(255,255,255,.6); padding:1px 5px; border-radius:4px;}
  .solution-box{background:var(--surface); border:1.5px solid var(--blue); border-radius:10px; padding:14px 16px; margin-top:10px;}
  .solution-box .solution-label{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13.1px; color:var(--blue); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px;}
  .solution-box .problem-text{font-size:16.6px;}
  .solution-body::after{content:""; display:table; clear:both;}
  .solution-media{float:left; width:40%; max-width:240px; margin:0 16px 10px 0; display:flex; flex-direction:column; gap:8px;}
  .solution-media img{max-width:100%; border-radius:8px; border:1px solid var(--border); display:block; margin:0 auto;}

    .solution-media{float:none; width:100%; max-width:100%; margin:0 0 10px 0;}

async function sbSelect(table, params) {

      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });

    if (!res.ok) return { data: null, error: data || { message: res.statusText } };
    return { data, error: null };
  } catch (e) {

  }

async function sbRpc(fn, body) {
  try {
    const res = await fetch(`${REST_URL}/rpc/${fn}`, {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
      },

    return { data, error: null };

}

/* Постраничная версия sbRpc для RPC-функций, возвращающих ВСЮ таблицу
   (get_teacher_answer_key, get_student_progress, get_teacher_summary,
   get_teacher_attempts). Настройка проекта Supabase "Max Rows" (по
   умолчанию 1000) молча обрезает такие ответы — при >1000 строк в
   answer_key/progress/attempts часть данных пропадала бы на экране
   учителя. limit/offset передаются как query-параметры (не заголовок
   Range — его поддержка на POST-запросах к /rpc/ не гарантирована). */
async function sbRpcAll(fn, body, pageSize) {
  pageSize = pageSize || 1000;
  let all = [];
  let offset = 0;
  const maxIterations = 200; // предохранитель от зацикливания
  for (let iter = 0; iter < maxIterations; iter++) {
    try {
      const res = await fetch(`${REST_URL}/rpc/${fn}?limit=${pageSize}&offset=${offset}`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => null);
      if (!res.ok) return { data: null, error: data || { message: res.statusText } };
      if (!Array.isArray(data)) return { data, error: null };
      all = all.concat(data);
      if (data.length < pageSize) return { data: all, error: null };
      offset += pageSize;
    } catch (e) {
      return { data: null, error: { message: String(e) } };
    }
  }
  return { data: all, error: null };
}

async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function isRateLimitError(msg){
  return !!msg && /rate limit|reload to continue/i.test(msg);
}
function isTooLargeError(msg){
  return !!msg && /лимит хранилища/.test(msg);
}

const RATE_LIMIT_MSG = 'Достигнут лимит запросов к серверу в этой сессии.\nОбновите страницу — до этого повторные попытки сохранения работать не будут. Ваши несохранённые данные останутся в поле, после обновления войдите заново и сохраните ещё раз.';

/* Пытается повторить сохранение один раз с подтверждением пользователя.
   Возвращает true, если в итоге сохранить удалось. Сама показывает нужное сообщение об ошибке. */
async function handleSaveFailure(retryFn){
  if(isRateLimitError(lastStorageError)){
    await customAlert(RATE_LIMIT_MSG);
    return false;
  }
  if(isTooLargeError(lastStorageError)){
    await customAlert(lastStorageError);
    return false;
  }
  const retry = await customConfirm('Не удалось сохранить (' + (lastStorageError && lastStorageError.message ? lastStorageError.message : (lastStorageError||'проблема со связью с сервером')) + ').\nПопробовать ещё раз сейчас?');
  if(!retry) return false;
  const ok = await retryFn();
  if(!ok){
    if(isRateLimitError(lastStorageError)) await customAlert(RATE_LIMIT_MSG);
    else if(isTooLargeError(lastStorageError)) await customAlert(lastStorageError);
    else await customAlert('Всё ещё не удалось сохранить (' + (lastStorageError && lastStorageError.message ? lastStorageError.message : (lastStorageError||'нет связи с сервером')) + '). Подождите немного и повторите попытку.');
  }
  return ok;
}

/* ================= CUSTOM DIALOGS =================
   Встроенные окна вместо системных prompt()/confirm()/alert() —
   в песочнице предпросмотра Claude системные диалоги иногда не показываются. */
function showDialog(message, opts){
  return new Promise(resolve=>{
    const overlay = document.getElementById('custom-dialog-overlay');
    const msgEl = document.getElementById('custom-dialog-message');
    const inputEl = document.getElementById('custom-dialog-input');
    const btnsEl = document.getElementById('custom-dialog-buttons');
    msgEl.textContent = message;
    btnsEl.innerHTML = '';

    if(opts.input){
      inputEl.style.display = 'block';
      inputEl.type = opts.password ? 'password' : 'text';
      inputEl.value = '';
      inputEl.placeholder = opts.placeholder || '';
      setTimeout(()=>inputEl.focus(), 30);
    } else {
      inputEl.style.display = 'none';
    }

    function close(result){
      overlay.style.display = 'none';
      inputEl.onkeydown = null;
      resolve(result);
    }

    if(opts.input){
      const ok = document.createElement('button');
      ok.type = 'button';
      ok.className = 'btn btn-dark btn-sm';
      ok.textContent = opts.okLabel || 'OK';
      ok.onclick = ()=>close(inputEl.value);
      const cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'btn btn-sm';
      cancel.textContent = 'Отмена';
      cancel.onclick = ()=>close(null);
      btnsEl.appendChild(cancel); btnsEl.appendChild(ok);
      inputEl.onkeydown = (e)=>{
        if(e.key==='Enter'){ e.preventDefault(); close(inputEl.value); }
        if(e.key==='Escape'){ e.preventDefault(); close(null); }
      };
    } else if(opts.confirm){
      const yes = document.createElement('button');
      yes.type = 'button';
      yes.className = 'btn btn-dark btn-sm';
      yes.textContent = opts.okLabel || 'Да';
      yes.onclick = ()=>close(true);
      const no = document.createElement('button');
      no.type = 'button';
      no.className = 'btn btn-sm';
      no.textContent = opts.cancelLabel || 'Отмена';
      no.onclick = ()=>close(false);
      btnsEl.appendChild(no); btnsEl.appendChild(yes);
    } else {
      const ok = document.createElement('button');
      ok.type = 'button';
      ok.className = 'btn btn-dark btn-sm';
      ok.textContent = 'OK';
      ok.onclick = ()=>close(true);
      btnsEl.appendChild(ok);
    }
    overlay.style.display = 'flex';
  });
}
function customPrompt(message, password){ return showDialog(message, {input:true, password:!!password}); }
function customConfirm(message){ return showDialog(message, {confirm:true}); }
function customAlert(message){ return showDialog(message, {}); }

/* Загружает ОДИН параграф из хранилища, только если он ещё не запрашивался.
   Экономит запросы: при входе ничего не грузится, пока ученик/учитель не откроет конкретный параграф.
   При сбое делает одну повторную попытку (обычно это временный обрыв сети,
   а не системная проблема) и, если не помогло, НЕ помечает параграф как
   загруженный — иначе он молча остался бы пустым до перезагрузки страницы. */
async function ensureParLoaded(par, force){
  if(parLoaded[par] && !force) return;
  let { data, error } = await sbSelect('questions_public', { par: `eq.${par}`, select: '*' });
  if(error){
    await new Promise(r=>setTimeout(r, 400));
    ({ data, error } = await sbSelect('questions_public', { par: `eq.${par}`, select: '*' }));
  }
  if(error){
    lastStorageError = error;
    return;
  }
  const blob = {};
  (data||[]).forEach(row=>{
    blob[row.num] = {
      text: row.text || '',
      images: row.images || [],
      wideImages: row.wide_images || [],
      hasAnswer: !!row.has_answer,
      hintChain: row.hint_chain || null,
      followUp: row.has_follow_up ? {
        text: row.follow_up_text || '',
        images: row.follow_up_images || [],
        wideImages: row.follow_up_wide_images || [],
        hasAnswer: !!row.follow_up_has_answer
      } : null
    };
  });
  state.parBlobs[par] = blob;
  parLoaded[par] = true;
}

/* Ограничитель параллельности: одновременно выполняется не больше limit
   задач из items. Supabase — обычная база данных за PostgREST, она штатно
   обслуживает несколько параллельных запросов (это не то хранилище
   артефактов Claude с жёстким лимитом запросов, под которое был написан
   старый последовательный загрузчик ниже). Ограничение по-прежнему нужно,
   чтобы не отправлять все 72 запроса разом — на медленном канале или на
   бесплатном тарифе Supabase это может привести к таймаутам. */
const PAR_LOAD_CONCURRENCY = 6;

async function runWithLimit(items, limit, worker){
  let idx = 0;
  async function runOne(){
    while(idx < items.length){
      const my = idx++;
      await worker(items[my], my);
    }
  }
  const n = Math.min(limit, items.length) || 1;
  await Promise.all(Array.from({length:n}, runOne));
}

/* Параллельная загрузка нескольких параграфов с ограничением числа
   одновременных запросов (см. PAR_LOAD_CONCURRENCY), вместо строго
   последовательной загрузки по одному с паузой между запросами. Пауза 60мс
   и строгая последовательность были нужны под старое хранилище артефактов
   Claude с жёстким лимитом запросов — там параллельные запросы упирались в
   лимит и зависали без ответа, из-за чего экран навсегда оставался на
   "Загрузка...". Supabase так не ведёт себя, параллельные запросы к ней —
   обычная ситуация, поэтому пауза только замедляла загрузку без всякой
   пользы. Имя функции сохранено (используется в нескольких местах), но
   внутри теперь пул с ограниченным параллелизмом — сохраняет прогресс
   загрузки на экране и не блокируется одним зависшим запросом, при этом
   заметно быстрее строгой последовательности. */
async function loadParsSequentially(parsList, force, onProgress){
  let done = 0;
  await runWithLimit(parsList, PAR_LOAD_CONCURRENCY, async (par)=>{
    if(isGuidedPar(par)) await ensureGuidedParLoaded(par, force);
    else await ensureParLoaded(par, force);
    done++;
    if(onProgress) onProgress(done, parsList.length, par);
  });
}

/* Загружает все параграфы (TOTAL_PARS) разом — используется только для полного импорта файла со всеми задачами.
   Помечает "полностью загружено" только если действительно загрузились ВСЕ
   параграфы — если часть не удалось (см. ensureParLoaded), следующий вызов
   сам доберёт недостающее, а не оставит молчаливые пробелы навсегда. */
async function loadAllParBlobs(force, onProgress){
  if(state.parBlobsLoaded && !force) return;
  const all = [];
  for(let p=1; p<=TOTAL_PARS; p++) all.push(p);
  await loadParsSequentially(all, force, onProgress);
  state.parBlobsLoaded = all.every(p=>isGuidedPar(p) ? guidedParLoaded[p] : parLoaded[p]);
}

function getParBlob(par){
  if(!state.parBlobs[par]) state.parBlobs[par] = {};
  return state.parBlobs[par];
}

async function fetchProblem(key, force){
  const [par, num] = key.split('-').map(Number);
  await ensureParLoaded(par, force);
  const blob = getParBlob(par);
  return blob[num] || {text:'', hasAnswer:false, images:[], wideImages:[], followUp:null, hintChain:null};
}

/* Сохраняет ОДНУ задачу, но физически пишет весь файл параграфа целиком (один запрос) */
async function saveProblem(key, data){
  const [par, num] = key.split('-').map(Number);
  const id = dbId(par, num);
  const exists = !!(getParBlob(par)[num]);
  const hasFollowUp = !!data.followUp;
  const base = {
    p_password_hash: state.teacherPasswordHash,
    p_text: data.text || '',
    p_images: data.images || [],
    p_wide_images: data.wideImages || [],
    p_has_follow_up: hasFollowUp,
    p_follow_up_text: hasFollowUp ? (data.followUp.text||'') : null,
    p_follow_up_images: hasFollowUp ? (data.followUp.images||[]) : [],
    p_follow_up_wide_images: hasFollowUp ? (data.followUp.wideImages||[]) : [],
    p_answer: data.answer || '',
    p_follow_up_answer: hasFollowUp ? (data.followUp.answer||'') : null,
    p_solution_text: data.solutionText || null,
    p_solution_images: data.solutionImages || [],
    p_follow_up_solution_text: hasFollowUp ? (data.followUp.solutionText||null) : null,
    p_follow_up_solution_images: hasFollowUp ? (data.followUp.solutionImages||[]) : [],
    p_hint_chain: data.hintChain || null
  };
  let error;
  if(exists){
    ({ error } = await sbRpc('update_question', { ...base, p_id: id }));
  } else {
    ({ error } = await sbRpc('add_question', { ...base, p_par: par, p_num: num }));
  }
  if(error){ lastStorageError = error; return false; }
  await ensureParLoaded(par, true);
  await loadTeacherAnswerKey();
  return true;
}

/* Удаляет задачу — сдвиг номеров последующих задач и перенос записей
   учеников (по question_id) делает сама SQL-функция delete_question. */
async function deleteProblemStorage(key){
  const [par, num] = key.split('-').map(Number);
  const id = dbId(par, num);
  if(!(getParBlob(par)[num])){ delete teacherDrafts[key]; return true; }
  const { error } = await sbRpc('delete_question', { p_password_hash: state.teacherPasswordHash, p_id: id });
  if(error){ lastStorageError = error; return false; }
  delete teacherDrafts[key];
  await ensureParLoaded(par, true);
  await loadTeacherAnswerKey();
  return true;
}

/* ---------- ПЕРЕМЕЩЕНИЕ ЗАДАЧИ ---------- */
/* Перестановку номеров и перенос записей учеников делает SQL-функция
   move_question — задача oldNum встаёт сразу после afterNum. */
async function moveProblemAfter(par, oldNum, afterNum){
  if(getParBlob(par)[oldNum] === undefined || afterNum === oldNum) return true;
  const { error } = await sbRpc('move_question', { p_password_hash: state.teacherPasswordHash, p_par: par, p_old_num: oldNum, p_after_num: afterNum });
  if(error){ lastStorageError = error; return false; }
  await ensureParLoaded(par, true);
  await loadTeacherAnswerKey();
  return true;
}

async function init(){

}

/* Если в localStorage есть хеш пароля учителя от предыдущего входа —
   проверяем его на сервере (сам пароль нигде не хранится) и, если он ещё
   верен, сразу входим в режим учителя без экрана входа и без пароля.
   Если пароль учителя с тех пор поменяли — хеш из localStorage удаляется
   и показывается обычный экран входа. */
async function tryRestoreTeacherSession(){
  let hash = null;
  try{ hash = localStorage.getItem(TEACHER_HASH_KEY); }catch(e){}
  if(!hash) return;
  const { error } = await sbRpc('get_teacher_summary', { p_password_hash: hash });
  if(error){
    try{ localStorage.removeItem(TEACHER_HASH_KEY); }catch(e){}
    return;
  }
  state.teacherPasswordHash = hash;
  state.isTeacher = true;
  await loadTeacherAnswerKey();
  document.getElementById('gate').style.display = 'none';
  renderHeader();
  renderSidebar();
  renderEmptyMain();
}

/* Возвращает действующий хеш пароля учителя. Если он уже есть в состоянии
   (входили в этой сессии или он восстановлен из localStorage) — пароль не
   спрашивается повторно. Иначе показывает диалог, проверяет пароль на
   сервере и, если верен, запоминает хеш в state И в localStorage (чтобы не
   спрашивать пароль и после обновления страницы). Возвращает null, если
   пользователь отменил ввод или указал неверный пароль. */
async function authenticateTeacher(){
  if(state.teacherPasswordHash) return state.teacherPasswordHash;
  const pass = await customPrompt('Пароль учителя:', true);
  if(pass === null) return null;
  const hash = await sha256Hex(pass);
  const { error } = await sbRpc('get_teacher_summary', { p_password_hash: hash });
  if(error){ await customAlert('Неверный пароль'); return null; }
  state.teacherPasswordHash = hash;
  try{ localStorage.setItem(TEACHER_HASH_KEY, hash); }catch(e){}
  return hash;
}

/* Полный выход из режима учителя — забывает сохранённый хеш пароля и
   возвращает на экран входа (вход как ученик или учитель — только через
   этот экран, без автоматического возврата к профилю ученика). */
function exitTeacherMode(){
  state.isTeacher = false;
  state.teacherPasswordHash = null;
  try{ localStorage.removeItem(TEACHER_HASH_KEY); }catch(e){}
  document.getElementById('teacher-overlay').classList.remove('open');
  document.getElementById('gate').style.display = 'flex';
  markGateShown();
}


function normalizeName(s){ return s.trim().replace(/\s+/g,' '); }

let profileEntering = false;

async function enterProfile(){
  if(profileEntering) return; // защита от повторного клика, пока первая попытка ещё выполняется

  // Защита от ботов: если заполнено невидимое honeypot-поле или форма
  // отправлена подозрительно быстро после открытия экрана — тихо ничего не
  // делаем (без сообщения об ошибке, чтобы не подсказывать боту, что не так).
  const hp = document.getElementById('gate-hp');
  if(hp && hp.value.trim()) return;
  if(Date.now() - gateShownAt < GATE_MIN_MS) return;

  let val = normalizeName(document.getElementById('gate-name').value);
  if(!val){ document.getElementById('gate-name').focus(); return; }

  profileEntering = true;
  const btn = document.getElementById('gate-enter-btn');
  const nameInput = document.getElementById('gate-name');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Входим...';
  nameInput.disabled = true;

  try{
    state.studentName = val;
    state.isTeacher = false; // выходим из режима просмотра "как учитель" в шапке; сам пароль (если вводили) остаётся запомненным
    state.followUpVisible = {}; // сброс "открытых кнопкой" доп. задач предыдущего профиля —
                                 // иначе новый ученик на этом же устройстве видел бы доп. задачу
                                 // сразу, без нажатия кнопки, из-за состояния прошлой сессии
    state.studentData = await loadStudentProgress(val);
    state.guidedProgress = await loadStudentGuidedProgress(val);
    document.getElementById('gate').style.display = 'none';
    renderHeader();
    renderSidebar();
    renderEmptyMain();
  } finally {
    profileEntering = false;
    nameInput.disabled = false;
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

/* Подтягивает сохранённый прогресс ученика из Supabase (progress) и
   переводит его в ту же форму { "par-num": {given, correct, ts, attempts} },
   которую использует весь остальной интерфейс. */
async function loadStudentProgress(name){
  const { data, error } = await sbRpcAll('get_student_progress', { p_student_name: name });
  const result = {};
  if(error || !data) return result;
  data.forEach(row=>{
    const baseKey = dbIdToKey(row.question_id);
    const key = row.is_follow_up ? followUpDataKey(baseKey) : baseKey;
    result[key] = {
      given: row.last_answer || '',
      correct: !!row.last_correct,
      ts: row.last_timestamp ? new Date(row.last_timestamp).getTime() : Date.now(),
      attempts: row.attempts || 0,
      hintViewed: !!row.hint_viewed
    };
  });
  return result;
}

function switchProfile(){
  document.getElementById('teacher-overlay').classList.remove('open');
  document.getElementById('gate').style.display = 'flex';

  const inp = document.getElementById('gate-name');

}

async function enterAsTeacher(){
  const hash = await authenticateTeacher();
  if(!hash) return;
  state.isTeacher = true;
  // сбрасываем прогресс/выделенную задачу предыдущего ученика — иначе в
  // режиме учителя кружки в меню и надписи «верно/неверно» оставались
  // раскрашенными по данным того, кто входил последним как ученик
  state.studentData = {};
  state.currentKey = null;
  state.followUpVisible = {};

  document.getElementById('gate').style.display = 'none';

  switchTab('problems');
}

function problemsForPar(par){
  if(isGuidedPar(par)){
    return Object.keys(getGuidedBlob(par)).map(Number).sort((a,b)=>a-b);
  }
  const blob = state.parBlobs[par] || {};
  return Object.keys(blob).map(Number).sort((a,b)=>a-b);
}

/* Название раздела без "Раздел I. "/"Раздел II. " и т.п. впереди —
   используется, чтобы понять, дублирует ли единственная тема раздела его
   же название (актуально для разделов, где в CURRICULUM всего одна тема
   на раздел). В этом случае лишний уровень вложенности с повтором
   названия в сайдбаре не показываем, параграфы идут сразу под разделом. */
function sectionBareName(sectionTitle){
  return sectionTitle.replace(/^[IVXLCDM]+\.\s*/, '').trim();
}

/* Диапазон номеров параграфов темы для подписи в сайдбаре, например
   "(§1–§8)" для темы из параграфов 1..8, или "(§68)" если параграф один. */
function parRangeLabel(pars){
  if(!pars || !pars.length) return '';
  const first = pars[0].num, last = pars[pars.length-1].num;
  return first===last ? `(§${first})` : `(§${first}–§${last})`;
}

function parRowsHtml(pars){
  return pars.map(p=>{
    const parOpen = !!state.expandedPar[p.num];
    const nums = problemsForPar(p.num);
    return `
    <div>
      <div class="par-row" onclick="togglePar(${p.num})">
        <span class="caret" style="border-color:#5A6A96; ${parOpen?'transform:rotate(45deg);':''}"></span>
        <span><span class="par-num">§${p.num}</span> ${escapeHtml(PAR_INDEX[p.num].title)}</span>
      </div>
      <div class="chips ${parOpen?'open':''}" id="chips-${p.num}">
        ${nums.length ? nums.map(n=>chipHtml(p.num,n)).join('') : ''}
      </div>
      ${parOpen && !nums.length ? `<div class="chip-empty">Задачи пока не добавлены</div>` : ''}
    </div>`;
  }).join('');
}

function renderSidebar(){
  const el = document.getElementById('sidebar');
  el.innerHTML = CURRICULUM.map((sec, si)=>{
    const secOpen = !!state.expandedSec[si];
    const skipSubHeader = sec.subs.length === 1 && sec.subs[0].name === sectionBareName(sec.section);
    return `
    <div class="sec-block">
      <div class="sec-head" onclick="toggleSec(${si})">
        <span class="caret ${secOpen?'open':''}"></span>${escapeHtml(sec.section)}
      </div>
      <div class="sub-list ${secOpen?'open':''}">
        ${skipSubHeader ? `<div class="par-list open">${parRowsHtml(sec.subs[0].pars)}</div>` : sec.subs.map((sub, ui)=>{
          const subKey = si+"_"+ui;
          const subOpen = !!state.expandedSub[subKey];
          return `
          <div>
            <div class="sub-head" onclick="toggleSub('${subKey}')">
              <span class="caret ${subOpen?'open':''}"></span><span class="sub-head-text">${escapeHtml(sub.name)}<span class="sub-par-range">${parRangeLabel(sub.pars)}</span></span>
            </div>
            <div class="par-list ${subOpen?'open':''}">
              ${parRowsHtml(sub.pars)}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function taskLabel(par, num){
  // Формат номера задачи: §N, задача M внутри параграфа -> "N.M" (например §3, задача 1 -> 3.1)
  return par + "." + num;
}

function chipHtml(par, num){
  if(isGuidedPar(par)) return guidedChipHtml(par, num);
  const key = pKey(par,num);
  const rec = state.studentData[key];
  const fuRec = state.studentData[followUpDataKey(key)];
  let cls = '';
  if(rec){
    // доп. задача теперь выдаётся за ВЕРНЫЙ основной ответ (бонус, а не
    // переделка), поэтому её результат не переопределяет цвет "верно/неверно"
    // основной задачи — тот считается как обычно.
    // Если ответа не было вовсе (ученик только смотрел указание — given
    // пустой из-за view_hint, который last_answer не трогает), это не
    // "неверно", а просто "приступил" — серый, как и в профильном уровне.
    const answered = !!(rec.given && rec.given.trim());
    cls = rec.correct ? ((rec.attempts>1) ? 'retry' : 'correct') : (answered ? 'wrong' : 'touched');
  }
  // Синяя рамка-напоминание — независима от того, что доп. задача теперь
  // выдаётся за верный ответ. Рамка появляется, если ученик хоть раз
  // ошибся в ОСНОВНОЙ задаче (сейчас неверный ответ, либо решил верно, но
  // не с первой попытки — attempts>1 это и означает), и гаснет только
  // когда доп. задача решена ВЕРНО (fuRec.correct===true). Если ошибок
  // в основной задаче не было (верно с первого раза), рамка не появляется,
  // даже если кнопка бонуса уже показана.
  const prob = (getParBlob(par) || {})[num];
  const hasFollowUp = !!(prob && prob.followUp && ((prob.followUp.text && prob.followUp.text.trim()) || (prob.followUp.images && prob.followUp.images.length) || (prob.followUp.wideImages && prob.followUp.wideImages.length)));
  const everWrongOnMain = !!(rec && (!rec.correct || rec.attempts > 1));
  const followUpPending = hasFollowUp && everWrongOnMain && !(fuRec && fuRec.correct);
  const active = state.currentKey===key ? 'active' : '';
  const hintedBorder = !state.isTeacher && isPovyshPar(par) && rec && rec.hintViewed && cls !== 'retry';
  return `<div class="chip ${cls} ${active} ${followUpPending?'followup-pending':''} ${hintedBorder?'hinted-border':''}" onclick="event.stopPropagation();selectProblem(${par},${num})">${taskLabel(par,num)}</div>`;
}

function toggleSec(si){ state.expandedSec[si] = !state.expandedSec[si]; renderSidebar(); }
function toggleSub(key){ state.expandedSub[key] = !state.expandedSub[key]; renderSidebar(); }
async function togglePar(num){
  state.expandedPar[num] = !state.expandedPar[num];
  const alreadyLoaded = isGuidedPar(num) ? guidedParLoaded[num] : parLoaded[num];
  if(state.expandedPar[num] && !alreadyLoaded){
    renderSidebar(); // показать раскрытие сразу, задачи подгрузятся чуть позже
    if(isGuidedPar(num)) await ensureGuidedParLoaded(num);
    else await ensureParLoaded(num);
  }
  renderSidebar();
}

function followUpDataKey(key){ return key + '-followup'; }

async function selectProblem(par, num){
  if(isGuidedPar(par)) return selectGuidedProblem(par, num);
  const key = pKey(par,num);
  state.currentKey = key;
  document.getElementById('sidebar').querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  renderSidebar();
  const meta = PAR_INDEX[par];
  // force:true — не полагаемся на parLoaded-кеш параграфа (он мог быть заполнен
  // раньше, например при раскрытии параграфа в сайдбаре). Без этого ученик,
  // не обновлявший вкладку, продолжал видеть старое условие/ответ даже после
  // того, как учитель отредактировал и опубликовал задачу заново.
  const prob = await fetchProblem(key, true);
  const rec = state.studentData[key];
  const hasContent = (prob.text && prob.text.trim()) || (prob.images && prob.images.length) || (prob.wideImages && prob.wideImages.length);
  const mi = document.getElementById('main-inner');

  // Доп. задача — бонус за ВЕРНЫЙ ответ на основную, но только если он
  // пришёл ПОСЛЕ хотя бы одной ошибки (rec.attempts>1). Доступность больше
  // не хранится отдельной записью — вычисляется прямо из результата
  // основной задачи, поэтому логика не может "потеряться" при пересчёте.
  // Учителю (state.isTeacher) это ограничение не действует — он должен
  // видеть основную и дополнительную задачу вместе, сразу как открыл
  // задачу, без необходимости имитировать неверный/верный ответ ученика.
  const fuKey = followUpDataKey(key);
  const fuRec = state.studentData[fuKey];
  const hasFollowUp = !!(prob.followUp && ((prob.followUp.text && prob.followUp.text.trim()) || (prob.followUp.images && prob.followUp.images.length) || (prob.followUp.wideImages && prob.followUp.wideImages.length)));
  const followUpOffered = hasFollowUp && !!(rec && rec.correct && rec.attempts > 1);
  const fuAnswered = !!(fuRec && fuRec.attempts > 0);
  const showFollowUpBlock = state.isTeacher ? hasFollowUp : (followUpOffered && (state.followUpVisible[key] || fuAnswered));

  // В режиме учителя поле "Ваш ответ" заполняется правильным ответом из
  // answer_key — это просто предпросмотр ключа проверки, а не имитация
  // ответа ученика (значение никуда не отправляется, пока не нажать
  // "Проверить"). Обычному ученику поле, как и раньше, показывает то, что
  // он сам вводил в последний раз.
  const teacherKey = teacherAnswerKeyCache[dbId(par, num)] || {};
  const mainAnswerValue = state.isTeacher ? (teacherKey.answer || '') : (rec ? rec.given : '');

  mi.innerHTML = `
    <div class="par-eyebrow">${escapeHtml(meta.title)}</div>
    <h1 class="problem-title">Задача ${taskLabel(par,num)}</h1>
    <div class="problem-card${state.isTeacher ? '' : ' no-select'}" ${state.isTeacher ? '' : 'oncontextmenu="return false" onselectstart="return false" oncopy="return false"'}>
      ${state.isTeacher ? copyImgBtnHtml() : ''}
      ${state.isTeacher ? `<div class="problem-label">Задача ${taskLabel(par,num)}</div>` : ''}
      <div class="problem-body">
        ${prob.images && prob.images.length ? `<div class="problem-media">${prob.images.map(src=>`<img src="${src}" alt="Условие задачи">`).join('')}</div>` : ''}
        <div class="problem-text-col">
          ${prob.text && prob.text.trim() ? `<div class="problem-text">${formatPhysicsText(prob.text)}</div>` : ''}
          ${!hasContent ? `<div class="problem-text placeholder-text">Условие этой задачи ещё не загружено учителем.</div>` : ''}
        </div>
      </div>
      ${prob.wideImages && prob.wideImages.length ? `<div class="problem-wide-media">${prob.wideImages.map(src=>`<img src="${src}" alt="Условие задачи (целиком)">`).join('')}</div>` : ''}
    </div>
    <div class="field-label">Ваш ответ</div>
    <div class="answer-row">
      <input class="answer-input" id="answer-input" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Введите ответ" value="${escapeAttr(mainAnswerValue)}" ${!prob.hasAnswer?'disabled':''} oninput="sanitizeAnswerInput(this)" onkeydown="if(event.key==='Enter')submitAnswer('${key}')">
      <button type="button" class="btn btn-dark" onclick="submitAnswer('${key}')" ${!prob.hasAnswer?'disabled':''}>Проверить</button>
    </div>
    <div class="feedback ${rec? (rec.correct?((rec.attempts>1)?'retry':'correct'):((rec.given&&rec.given.trim())?'wrong':'touched')) : ''}" id="feedback">${rec ? (rec.correct?(rec.attempts>1?'Верно!':'Верно! Отличная работа.'):((rec.given&&rec.given.trim())?'Неверно. Попробуйте ещё раз.':'Приступил.')) : ''}</div>
    ${!prob.hasAnswer ? `<div class="prev-answer">Проверка появится, когда учитель добавит правильный ответ к этой задаче.</div>` : ''}
    ${state.isTeacher && prob.hasAnswer ? `<div class="prev-answer">Показан правильный ответ (виден только вам, ученику — нет).</div>` : ''}
    ${state.isTeacher ? solutionBoxHtml('Полное решение (видно только вам)', teacherKey.solutionText, teacherKey.solutionImages) : ''}
    ${rec ? `<div class="prev-answer">Последняя попытка: ${new Date(rec.ts).toLocaleString('ru-RU')}</div>` : ''}
    ${isPovyshPar(par) && prob.hintChain && prob.hintChain.length ? povyshHintBlockHtml(key, prob.hintChain) : ''}

}

/* ================= КОПИРОВАНИЕ ЗАДАЧИ КАК КАРТИНКИ (только учитель) =================
   Заменяет скриншот «Ножницами»: карточка задачи (основная или дополнительная —
   каждая отдельно) рисуется в PNG тем же рендером браузера, что и на экране
   (дроби, корни, векторы, картинки — как есть), и кладётся в буфер обмена, чтобы
   сразу вставить в Word/Telegram/WhatsApp. Всё, что помечено классом no-capture
   (сама кнопка, поле ответа, «Проверить», подсказки и решение), в кадр не попадает.
   Библиотека html-to-image
   подгружается с CDN при первом нажатии, на обычную работу сайта не влияет. */
const H2I_URL = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js';
// Масштаб итоговой картинки относительно размера на экране: 1 — как на экране
// (824 px в ширину при обычном окне), 2 — вдвое крупнее и чётче. 2/1.4 ≈ 1.43.
const COPY_IMG_SCALE = 2/1.4;
let h2iPromise = null;
function loadHtmlToImage(){
  if(window.htmlToImage) return Promise.resolve(window.htmlToImage);
  if(!h2iPromise){
    h2iPromise = new Promise((resolve, reject)=>{
      const sc = document.createElement('script');
      sc.src = H2I_URL;
      sc.onload = ()=>resolve(window.htmlToImage);
      sc.onerror = ()=>{ h2iPromise = null; reject(new Error('Не удалось загрузить библиотеку html-to-image (проверьте интернет).')); };
      document.head.appendChild(sc);
    });
  }
  return h2iPromise;
}

function copyImgBtnHtml(){
  return `<button type="button" class="btn btn-sm copy-img-btn no-capture" onclick="copyCardAsImage(this)">Копировать как картинку</button>`;
}

async function renderCardToBlob(el){
  const h2i = await loadHtmlToImage();
  if(document.fonts && document.fonts.ready) { try{ await document.fonts.ready; }catch(e){} }
  // Рендерим не живую карточку, а её копию за пределами экрана без элементов
  // no-capture: иначе кадр сохранил бы высоту и отступы оригинала (пустое место
  // на месте поля ответа, сдвиг из-за margin).
  const width = el.getBoundingClientRect().width;
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed; left:-99999px; top:0; width:' + width + 'px; pointer-events:none;';
  const clone = el.cloneNode(true);
  clone.querySelectorAll('.no-capture').forEach(n=>n.remove());
  clone.style.margin = '0';
  clone.style.border = 'none';        // без внешней рамки карточки (серой у основной, жёлтой у дополнительной)
  clone.style.borderRadius = '0';
  clone.style.boxShadow = 'none';
  // и без рамки вокруг иллюстраций внутри задачи
  clone.querySelectorAll('img').forEach(im=>{ im.style.border = 'none'; im.style.borderRadius = '0'; });
  clone.style.width = width + 'px';
  holder.appendChild(clone);
  document.body.appendChild(holder);
  try{
    const opts = { pixelRatio: COPY_IMG_SCALE, backgroundColor: '#FFFFFF' };
  // html-to-image сам находит @font-face сайта (Old Standard TT, JetBrains Mono
  // и т.д.) и встраивает нужные файлы шрифтов в картинку — чтения ссылки на
  // Google Fonts достаточно, если у неё есть атрибут crossorigin (см. <head>).
    // Safari при первом рендере иногда отдаёт пустую картинку (шрифты/картинки
    // ещё не встроены) — прогреваем рендер одним холостым вызовом.
    if(/^((?!chrome|android).)*safari/i.test(navigator.userAgent)) { try{ await h2i.toBlob(clone, opts); }catch(e){} }
    const blob = await h2i.toBlob(clone, opts);
    if(!blob) throw new Error('Пустая картинка.');
    return blob;
  } finally {
    holder.remove();
  }
}

async function copyCardAsImage(btn){
  if(btn.disabled) return;
  const card = btn.closest('.problem-card, .followup-card');
  if(!card) return;
  const originalLabel = btn.textContent;
  btn.disabled = true; btn.textContent = 'Готовлю…';
  let doneLabel = originalLabel;
  try{
    if(!(navigator.clipboard && window.ClipboardItem)){
      throw new Error('этот браузер не умеет копировать картинки в буфер обмена (нужен современный Chrome, Edge или Safari и адрес https://).');
    }
    // Promise передаётся сразу (не готовый blob) — так Safari не теряет
    // «жест пользователя» за время рендера.
    await navigator.clipboard.write([ new ClipboardItem({ 'image/png': renderCardToBlob(card) }) ]);
    doneLabel = 'Скопировано ✓';
  }catch(e){
    await customAlert('Не удалось скопировать картинку: ' + (e && e.message ? e.message : e));
  }
  btn.textContent = doneLabel;
  setTimeout(()=>{ btn.disabled = false; btn.textContent = originalLabel; }, 1800);
}

function showFollowUp(key){
  state.followUpVisible[key] = true;

  selectProblem(par, num);
}

function normalizeAns(s){
  return (s||'').toString().trim().toLowerCase().replace(/,/g,'.').replace(/\s+/g,'');
}

/* Разрешает вводить в поле ответа только цифры, минус и запятую — отсекает
   всё остальное на лету (в т.ч. вставку из буфера обмена). Используется и
   в поле ответа ученика, и в полях эталонного ответа в панели учителя —
   формат должен совпадать, т.к. проверка идёт по точному совпадению строк
   (см. submit_answer в SQL). Курсор при этом не "прыгает" в конец —
   пересчитываем позицию с учётом вырезанных символов. */
function sanitizeAnswerInput(el){
  const clean = el.value.replace(/[^0-9,\-]/g, '');
  if(clean !== el.value){
    const removedBefore = el.value.slice(0, el.selectionStart).length - clean.slice(0, el.selectionStart).length;
    const pos = Math.max(0, el.selectionStart - removedBefore);
    el.value = clean;
    try{ el.setSelectionRange(pos, pos); }catch(e){}
  }
}

async function submitAnswer(key){
  if(!state.studentName){ await customAlert('Чтобы сохранять ответы, войдите как ученик (введите имя на экране входа).'); return; }
  const [par, num] = key.split('-').map(Number);
  const input = document.getElementById('answer-input');
  const given = input.value.trim();
  if(!given) { input.focus(); return; }
  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.style.display = 'block';
  fb.style.background = 'var(--blue-soft)'; fb.style.color = 'var(--blue)';
  fb.textContent = 'Проверяем...';

  const { data, error } = await sbRpc('submit_answer', {
    p_student_name: state.studentName,
    p_question_id: dbId(par, num),
    p_answer: given,
    p_is_follow_up: false
  });

  if(error){
    fb.style.background = 'var(--red-soft)'; fb.style.color = 'var(--red)';
    fb.textContent = 'Не удалось сохранить ответ. Проверьте связь и нажмите «Проверить» ещё раз.';
    return;
  }

  const row = Array.isArray(data) ? data[0] : data;
  const correct = row.is_correct;
  const attempts = row.attempt_number;
  state.studentData[key] = { given, correct, ts: Date.now(), attempts };

  fb.style.background = ''; fb.style.color = '';
  const retry = correct && attempts > 1;
  fb.className = 'feedback ' + (correct ? (retry ? 'retry' : 'correct') : 'wrong');
  fb.textContent = correct ? (retry ? 'Верно!' : 'Верно! Отличная работа.') : 'Неверно. Попробуйте ещё раз.';
  // полная перерисовка панели: без этого кнопка «Получить дополнительную
  // задачу» и синяя рамка в меню появлялись только при повторном открытии
  // задачи, а не сразу после неверного ответа
  await selectProblem(par, num);
}

/* Проверка ответа на дополнительную (вложенную) задачу. key — ключ ОСНОВНОЙ
   задачи ("par-num"); результат хранится отдельной записью studentData под
   followUpDataKey(key), чтобы не путаться со статистикой основной задачи. */
async function submitFollowUpAnswer(key){
  if(!state.studentName){ await customAlert('Чтобы сохранять ответы, войдите как ученик (введите имя на экране входа).'); return; }
  const fuKey = followUpDataKey(key);
  const input = document.getElementById('followup-answer-input');
  const given = input.value.trim();
  if(!given) { input.focus(); return; }
  const fb = document.getElementById('followup-feedback');
  fb.className = 'feedback';
  fb.style.display = 'block';
  fb.style.background = 'var(--blue-soft)'; fb.style.color = 'var(--blue)';
  fb.textContent = 'Проверяем...';

  const [par, num] = key.split('-').map(Number);

  const { data, error } = await sbRpc('submit_answer', {
    p_student_name: state.studentName,
    p_question_id: dbId(par, num),
    p_answer: given,
    p_is_follow_up: true
  });

  if(error){
    fb.style.background = 'var(--red-soft)'; fb.style.color = 'var(--red)';
    fb.textContent = 'Не удалось сохранить ответ. Проверьте связь и нажмите «Проверить» ещё раз.';
    return;
  }

  const row = Array.isArray(data) ? data[0] : data;
  const correct = row.is_correct;
  const attempts = row.attempt_number;
  state.studentData[fuKey] = { given, correct, ts: Date.now(), attempts };

  fb.style.background = ''; fb.style.color = '';
  const retry = correct && attempts > 1;
  fb.className = 'feedback ' + (correct ? (retry ? 'retry' : 'correct') : 'wrong');
  fb.textContent = correct ? (retry ? 'Верно!' : 'Верно! Отличная работа.') : 'Неверно. Попробуйте ещё раз.';
  // та же причина: полностью перерисовываем панель, чтобы синяя рамка в меню
  // сразу стала обычной и карточка доп. задачи отразила актуальный статус
  await selectProblem(par, num);
}

function escapeHtml(s){
  return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

/* Находит индекс закрывающей "}" для "{", начинающейся в позиции openIdx (с учётом вложенности). */
function matchBrace(text, openIdx){
  let depth = 0;
  for(let k = openIdx; k < text.length; k++){
    if(text[k] === '{') depth++;
    else if(text[k] === '}'){ depth--; if(depth === 0) return k; }
  }
  return -1;
}

/* Срезает опечатку-скобку на краю содержимого ({...}), если баланс открывающих/
   закрывающих скобок внутри не сходится — защита от дублей при ручном наборе
   (например если кнопка "( )" была нажата, а учитель ещё раз сам напечатал "("
   или ")" рядом с шаблоном). Трогает только САМЫЙ край строки (первый или
   последний символ) и только если это действительно даёт баланс. */
function stripStrayBracket(inner, open, close){
  const opens = (inner.match(new RegExp('\\'+open, 'g'))||[]).length;
  const closes = (inner.match(new RegExp('\\'+close, 'g'))||[]).length;
  if(opens > closes && inner[0] === open) return inner.slice(1);
  if(closes > opens && inner[inner.length-1] === close) return inner.slice(0, -1);
  return inner;
}

/* Единый рекурсивный разборщик текста условия:
   - латинские буквы — курсивом (обозначения величин);
   - цифры — тем же шрифтом, но прямым начертанием (как в формулах);
   - «буква + объединяющая стрелка» → CSS-стрелка над буквой (не зависит от шрифта);
   - √{...} → корень с чертой над выражением;
   - ^{...} / ^x → верхний индекс (степень) — любое выражение, не только цифры;
   - _{...} / _x → нижний индекс — любое выражение;
   индексы и степени можно вкладывать друг в друга и комбинировать. */
const MATH_FUNCTION_NAMES = new Set(['sin','cos','tg','ctg','ln','log','arcsin','arccos','arctg']);

/* Невидимый маркер принудительного переноса строки (используется кнопкой
   «¶ Новый абзац» на панели формул) — см. insertParagraphBreak() и smartWrap() ниже. */
const PARAGRAPH_BREAK_MARKER = '\u200B';

/* Второй параметр upright — "унаследованный" режим прямого начертания:
   когда true, латинские буквы (обычно курсивные — обозначения величин)
   рисуются прямым шрифтом вместо курсива. Включается маркером !{...}
   (см. ниже) и передаётся во все вложенные вызовы formatMath, кроме %{...}
   (явный курсив), который всегда сбрасывает его обратно в false. */
function formatMath(raw, upright){
  const text = raw || '';
  let out = '';
  let i = 0;
  // Высокая скобка (с дробью внутри), только что добавленная в out: нужна, чтобы
  // степень сразу после неё («(…)^2») поднять к верхнему краю скобки.
  let tallStart = -1, tallEnd = -1;
  const powAfterTall = (supHtml)=>{
    if(tallStart >= 0 && tallEnd === out.length){
      out = out.slice(0, tallStart) + '<span class="pow-group">' + out.slice(tallStart) + supHtml.replace('<sup>','<sup class="sup-top">') + '</span>';
      tallStart = tallEnd = -1;
      return true;
    }
    return false;
  };
  while(i < text.length){
    const ch = text[i];

    if(ch === '√' && text[i+1] === '{'){
      const close = matchBrace(text, i+1);
      if(close !== -1){
        const inner = text.slice(i+2, close);
        // SVG-«крючок» растягивается по высоте под любое содержимое сам —
        // отдельный "высокий" вариант для дробей под корнем (как было со
        // шрифтовым символом √) больше не нужен.
        out += `<span class="sqrt-wrap"><span class="sqrt-hook"><span class="sqrt-foot"><svg viewBox="0 0 30 105" preserveAspectRatio="none"><path class="sq-thin" d="M1,60 L7,53"/><path class="sq-thick" d="M7,53 L20,104"/></svg></span><span class="sqrt-long"><svg viewBox="0 0 30 100" preserveAspectRatio="none"><path class="sq-thin" d="M0,100 L30,0"/></svg></span></span><span class="sqrt-content">${formatMath(inner, upright)}</span></span>`;
        i = close + 1; continue;
      }
    }
    if(ch === '#' && text[i+1] === '{'){
      const close = matchBrace(text, i+1);
      if(close !== -1){
        out += `<span class="overline">${formatMath(text.slice(i+2, close), upright)}</span>`;
        i = close + 1; continue;
      }
    }
    if(ch === '@' && text[i+1] === '{'){
      // Формула «без разрыва»: браузер не переносит строку внутри неё —
      // если она не влезает в остаток строки, переходит на следующую целиком.
      const close = matchBrace(text, i+1);
      if(close !== -1){
        out += `<span class="nobr">${formatMath(text.slice(i+2, close), upright)}</span>`;
        i = close + 1; continue;
      }
    }
    if(ch === '!' && text[i+1] === '{'){
      const close = matchBrace(text, i+1);
      if(close !== -1){
        out += `<span class="upright-fn">${formatMath(text.slice(i+2, close), true)}</span>`;
        i = close + 1; continue;
      }
    }
    if(ch === '*' && text[i+1] === '{'){
      const close = matchBrace(text, i+1);
      if(close !== -1){
        out += `<b>${formatMath(text.slice(i+2, close), upright)}</b>`;
        i = close + 1; continue;
      }
    }
    if(ch === '%' && text[i+1] === '{'){
      const close = matchBrace(text, i+1);
      if(close !== -1){
        out += `<em>${formatMath(text.slice(i+2, close), false)}</em>`;
        i = close + 1; continue;
      }
    }
    if(ch === '/' && text[i+1] === '{'){
      const c1 = matchBrace(text, i+1);
      if(c1 !== -1 && text[c1+1] === '{'){
        const c2 = matchBrace(text, c1+1);
        if(c2 !== -1){
          const num = text.slice(i+2, c1), den = text.slice(c1+2, c2);
          out += `<span class="frac"><span class="frac-num">${formatMath(num, upright)}</span><span class="frac-den">${formatMath(den, upright)}</span></span>`;
          i = c2 + 1; continue;
        }
      }
    }
    if(ch === '(' && text[i+1] === '{'){
      const close = matchBrace(text, i+1);
      if(close !== -1){
        const inner = stripStrayBracket(text.slice(i+2, close), '(', ')');
        const tall = /\/\{/.test(inner);
        const brStart = out.length;
        out += `<span class="bracket-wrap${tall?' bracket-tall':''}"><span class="bracket-char">(</span><span class="bracket-content">${formatMath(inner, upright)}</span><span class="bracket-char">)</span></span>`;
        if(tall){ tallStart = brStart; tallEnd = out.length; }
        i = (text[close+1] === ')') ? close + 2 : close + 1;
        continue;
      }
    }
    if(ch === '[' && text[i+1] === '{'){
      const close = matchBrace(text, i+1);
      if(close !== -1){
        const inner = stripStrayBracket(text.slice(i+2, close), '[', ']');
        const tall = /\/\{/.test(inner);
        const brStart = out.length;
        out += `<span class="bracket-wrap${tall?' bracket-tall':''}"><span class="bracket-char">[</span><span class="bracket-content">${formatMath(inner, upright)}</span><span class="bracket-char">]</span></span>`;
        if(tall){ tallStart = brStart; tallEnd = out.length; }
        i = (text[close+1] === ']') ? close + 2 : close + 1;
        continue;
      }
    }
    if(ch === '~' && text[i+1] === '{'){
      const c1 = matchBrace(text, i+1);
      if(c1 !== -1 && text[c1+1] === '{'){
        const c2 = matchBrace(text, c1+1);
        if(c2 !== -1){
          const top = text.slice(i+2, c1), bottom = text.slice(c1+2, c2);
          let j = c2+1;
          while(j < text.length && /[A-Za-zА-Яа-я]/.test(text[j])) j++;
          const elementSymbol = text.slice(c2+1, j);
          out += `<span class="nuclide-pre"><span>${formatMath(top, upright)}</span><span>${formatMath(bottom, upright)}</span></span><span class="upright-fn">${escapeHtml(elementSymbol)}</span>`;
          i = j; continue;
        }
      }
    }
    if(ch === '^' && text[i+1] === '{'){
      const close = matchBrace(text, i+1);
      if(close !== -1){
        { const sh = `<sup>${formatMath(text.slice(i+2, close), upright)}</sup>`; if(!powAfterTall(sh)) out += sh; }
        i = close + 1; continue;
      }
    }
    if(ch === '^' && text[i+1] && /[A-Za-zА-Яа-я0-9]/.test(text[i+1])){
      { const sh = `<sup>${formatMath(text[i+1], upright)}</sup>`; if(!powAfterTall(sh)) out += sh; }
      i += 2; continue;
    }
    if(ch === '_' && text[i+1] === '{'){
      const close = matchBrace(text, i+1);
      if(close !== -1){
        out += `<sub>${formatMath(text.slice(i+2, close), upright)}</sub>`;
        i = close + 1; continue;
      }
    }
    if(ch === '_' && text[i+1] && /[A-Za-zА-Яа-я0-9]/.test(text[i+1])){
      out += `<sub>${formatMath(text[i+1], upright)}</sub>`;
      i += 2; continue;
    }
    if(/[A-Za-z]/.test(ch) && text[i+1] === '\u20D7'){
      out += `<span class="vec-wrap${/[A-Zbdfhkl]/.test(ch)?' vec-cap':''}"><span class="vec-arrow">→</span>${escapeHtml(ch)}</span>`;
      i += 2; continue;
    }
    if(/[A-Za-z]/.test(ch)){
      let j = i+1;
      while(j < text.length && /[A-Za-z]/.test(text[j])) j++;
      const word = text.slice(i,j);
      if(MATH_FUNCTION_NAMES.has(word.toLowerCase()) || upright){
        out += `<span class="upright-fn">${escapeHtml(word)}</span>`;
      } else {
        out += `<i>${escapeHtml(word)}</i>`;
      }
      i = j; continue;
    }
    if(/[0-9]/.test(ch)){
      let j = i+1;
      while(j < text.length && /[0-9]/.test(text[j])) j++;
      out += `<span class="cm-num">${escapeHtml(text.slice(i,j))}</span>`;
      i = j; continue;
    }
    out += escapeHtml(ch);
    i++;
  }
  return out;
}

/* Убирает вынужденные переносы строк, оставшиеся от вёрстки исходного PDF
   (текст был подогнан под конкретную ширину страницы), и даёт тексту
   переноситься естественным образом по ширине экрана. Настоящие,
   осмысленные разрывы — перед вариантами ответа 1)/2)/3)/4), перед «Ответ:»,
   перед строками с маркером принудительного переноса (PARAGRAPH_BREAK_MARKER,
   вставляется кнопкой «¶ Новый абзац») и пустые строки (абзацы) — сохраняются.
   Маркер после этого вырезается — он служебный, для отображения не нужен.
   Отдельным шагом варианты 1)/2)/3)/4), оказавшиеся ВНУТРИ строки (например,
   если они шли подряд одной строкой из исходного PDF, без переноса между
   ними), тоже переносятся на новую строку — это частый случай при вставке
   текста вариантов ответа "как есть". */
function smartWrap(text, noOptionBreaks){
  const lines = text.split('\n');
  let out = lines[0] !== undefined ? lines[0] : '';
  for(let i=1; i<lines.length; i++){
    const line = lines[i];
    const trimmed = line.trim();
    const isMarked = trimmed.startsWith(PARAGRAPH_BREAK_MARKER);
    const isBreakBefore = isMarked || (!noOptionBreaks && /^[1-4]\)/.test(trimmed)) || /^Ответ\s*:/i.test(trimmed) || /^Запишите в таблицу/i.test(trimmed);
    const prevBlank = lines[i-1].trim() === '';
    const curBlank = trimmed === '';
    if(isBreakBefore || prevBlank || curBlank){
      out += '\n' + line;
    } else {
      out = out.replace(/[ \t]+$/,'') + ' ' + trimmed;
    }
  }
  // варианты ответа, оказавшиеся посреди строки (после пробела, не после
  // уже имеющегося переноса) — тоже переносим на новую строку. Требуем
  // пробел/таб непосредственно перед цифрой, поэтому число вида "21)" не
  // задевается (перед "1" там стоит цифра "2", а не пробел).
  if(!noOptionBreaks) out = out.replace(/[ \t]+(?=[1-4]\)(?!\d))/g, '\n');
  return out.split(PARAGRAPH_BREAK_MARKER).join('');
}

/* Фигурная скобка системы уравнений/неравенств (аналог LaTeX \begin{cases}) —
   рисуется одним SVG-путём, растянутым flex-контейнером (.sys-wrap с
   align-items:stretch) под высоту .sys-lines (любое число строк, включая 2).
   Атрибуты width="14" height="14" на самом теге переопределяют "естественное"
   соотношение сторон из viewBox (20×100) на 1:1 — без них при фиксированной
   CSS-шириной 14px браузер закладывает гипотетическую высоту ~70px, из-за
   чего скобка получается то выше текста, то куда больше нужного. CSS-класс
   отдельно задаёт height:auto — иначе HTML-атрибут height="14" фиксирует
   высоту и align-items:stretch её больше не растягивает. */
function sysBraceSvg(){
  return `<svg class="sys-brace-svg" width="14" height="14" viewBox="0 0 20 100" preserveAspectRatio="none">
    <path d="M14,0 C8,0 8,2 8,10 L8,42 C8,48 2,48 2,50 C2,52 8,52 8,58 L8,90 C8,98 8,100 14,100"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>`;
}

/* Срезает РОВНО ОДИН перенос строки в начале куска текста, если этот кусок
   идёт сразу после блока [sys]/[table]/[cols] (applyStrip=true). Иначе не
   трогает текст вообще. Зачем это нужно: formatPhysicsText вызывает smartWrap()
   отдельно для каждого куска текста между блоками, а smartWrap() сам по себе
   не видит "общей картины" — для него кусок, начинающийся с \n, выглядит так,
   будто перед этой строкой была ПУСТАЯ строка (настоящий разрыв абзаца), хотя
   на самом деле это просто один обычный Enter учителя сразу после блока
   (переход к следующей строке без намерения оставить пустую строку). Срезав
   один "технический" \n, мы возвращаем smartWrap() ровно ту семантику, что и
   в остальном тексте: один Enter — мягкий перенос (склеивается), два Enter
   подряд (то есть после среза всё ещё остаётся один \n в начале) — настоящий
   разрыв абзаца, как и было задумано учителем. */
function stripOneLeadingBreak(s, applyStrip){
  return (applyStrip && s.startsWith('\n')) ? s.slice(1) : s;
}

/* Для решений и цепочек подсказок: то же форматирование, но без автоматического
   переноса строки перед «1)», «2)», … (он нужен только для вариантов ответа в
   условиях и иногда рвёт формулу со скобкой). */
function formatSolutionText(raw){ return formatPhysicsText(raw, { noOptionBreaks: true }); }

function formatPhysicsText(raw, opts){
  const noOpt = !!(opts && opts.noOptionBreaks);
  const text = raw || '';
  const blockRe = /\[(table|cols|sys)\]([\s\S]*?)\[\/\1\]/g;
  let out = '';
  let last = 0;
  // true после того, как обработан хотя бы один блок [sys]/[table]/[cols] —
  // нужно, чтобы понимать, что следующий кусок текста начинается СРАЗУ после
  // блока (см. stripOneLeadingBreak ниже).
  let afterBlock = false;
  let m;
  while((m = blockRe.exec(text)) !== null){
    out += formatMath(smartWrap(stripOneLeadingBreak(text.slice(last, m.index), afterBlock), noOpt)).replace(/\n/g,'<br>');
    const tag = m[1], inner = m[2];
    if(tag === 'sys'){
      // Система уравнений/неравенств — каждая строка внутри [sys] становится
      // отдельной строкой системы, слева от них — фигурная скобка, растянутая
      // на нужное число строк. Как и в [cols], smartWrap здесь не применяется:
      // каждый Enter учителя — это ровно одна строка системы.
      const lines = inner.split('\n').map(l=>l.trim()).filter(l=>l.length);
      if(lines.length){
        out += `<div class="sys-wrap">
          ${sysBraceSvg()}
          <div class="sys-lines">${lines.map(l=>`<div class="sys-line">${formatMath(l)}</div>`).join('')}</div>
        </div>`;
      }
    } else if(tag === 'table'){
      const rows = inner.split('\n').map(r=>r.trim()).filter(r=>r.length);
      out += `<table class="prob-table"><tbody>${rows.map(r=>
        `<tr>${r.split('|').map(c=>`<td>${formatMath(c.trim())}</td>`).join('')}</tr>`
      ).join('')}</tbody></table>`;
    } else if(tag === 'cols'){
      // Разбивает выделенный кусок текста (например, длинный список вариантов
      // ответа) на 2 колонки — экономит место по высоте. Каждая строка внутри
      // [cols] (обычный перенос строки Enter) становится отдельным пунктом.
      // В отличие от обычного текста задачи, здесь НЕ применяется smartWrap
      // (склейка перенесённых строк вёрстки PDF в абзацы) — внутри [cols]
      // каждый Enter учителя всегда означает новый пункт списка.
      // Без маркера [break] — обычные CSS-колонки (column-count:2), браузер
      // сам балансирует высоту поровну. Если нужен конкретный неравный разрез
      // (например 4 строки в первой колонке, 7 во второй) — строка [break]
      // внутри [cols] задаёт точку перехода. CSS "принудительный разрыв
      // колонки" (break-after:column) ненадёжен в режиме автобаланса высоты
      // (некоторые браузеры, в частности Chrome, его игнорируют без явно
      // заданной высоты контейнера) — поэтому при наличии [break] верстаем
      // явными двумя flex-колонками с точным разбиением по индексу маркера,
      // а не полагаемся на автобаланс CSS-колонок.
      const rawLines = inner.split('\n').map(l=>l.trim()).filter(l=>l.length);
      const items = [];
      rawLines.forEach(line=>{
        if(line === '[break]'){
          if(items.length) items[items.length-1].brk = true;
          return;
        }
        items.push({ html: formatMath(line), brk: false });
      });
      const breakIdx = items.findIndex(it=>it.brk);
      if(breakIdx !== -1){
        const col1 = items.slice(0, breakIdx+1);
        const col2 = items.slice(breakIdx+1);
        out += `<div class="two-col-manual">
          <div class="two-col-manual-part">${col1.map(it=>`<div class="two-col-item">${it.html}</div>`).join('')}</div>
          <div class="two-col-manual-part">${col2.map(it=>`<div class="two-col-item">${it.html}</div>`).join('')}</div>
        </div>`;
      } else {
        out += `<div class="two-col">${items.map(it=>`<div class="two-col-item">${it.html}</div>`).join('')}</div>`;
      }
    }
    last = blockRe.lastIndex;
    afterBlock = true;
  }
  out += formatMath(smartWrap(stripOneLeadingBreak(text.slice(last), afterBlock), noOpt)).replace(/\n/g,'<br>');
  return out;
}

/* Рендер блока "Полное решение" (текст с формулами + опциональные картинки),
   видного только учителю. Общий хелпер для трёх мест, где он показывается:
   основной экран задачи (selectProblem/followUpCardHtml) и окно
   предпросмотра задачи (showProblemPreview). Возвращает '' если ни текста,
   ни картинок нет — тогда блок вообще не показывается. */
function solutionBoxHtml(label, solutionText, solutionImages){
  const hasText = !!(solutionText && solutionText.trim());
  const hasImages = !!(solutionImages && solutionImages.length);
  if(!hasText && !hasImages) return '';
  return `<div class="solution-box">
    <div class="solution-label">${escapeHtml(label)}</div>
    <div class="solution-body">
      ${hasImages ? `<div class="solution-media">${solutionImages.map(src=>`<img src="${src}" alt="Изображение к решению">`).join('')}</div>` : ''}
      ${hasText ? `<div class="problem-text">${formatSolutionText(solutionText)}</div>` : ''}
    </div>
  </div>`;
}

/* ================= TEACHER PANEL ================= */
async function openTeacherLogin(){
  const hash = await authenticateTeacher();
  if(!hash) return;
  state.isTeacher = true;
  // см. пояснение в enterAsTeacher() — сбрасываем прогресс предыдущего ученика,
  // но НЕ currentKey: если сейчас открыта задача (главная область никуда не

/* Альтернатива загрузке файла: вставить прямую ссылку на уже где-то
   размещённую картинку. Хранится тогда только сама строка-URL (десятки

   когда общий объём хранилища артефакта (лимит ~20 МБ на весь артефакт,
   не на параграф) уже близок к исчерпанию. Ссылка просто добавляется в
   тот же массив images/wideImages, что и base64-картинки — рендер условия
   их не различает (<img src="...">), так что можно свободно мешать оба
   способа в одной задаче. */
function isLikelyImageUrl(u){ return /^https?:\/\/\S+$/i.test((u||'').trim()); }

  if(!teacherDrafts[key][field]) teacherDrafts[key][field] = [];

  el.value = '';
  refreshDraftUI(key, field);
}
