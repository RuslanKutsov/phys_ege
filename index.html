function fileToDataURL(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* Сжатие картинки перед сохранением в хранилище: скриншоты задач из PDF часто
   весят по несколько МБ каждый (высокое разрешение исходного скана), а один
   файл хранилища физически хранит ВСЕ картинки ВСЕХ задач параграфа сразу
   (лимит 5 МБ на ключ) — без сжатия параграф с 3-5 задачами и парой картинок
   в каждой легко упрётся в лимит. Поэтому картинка перерисовывается на canvas
   с уменьшением до maxDim по большей стороне и пересохраняется как JPEG с
   заданным качеством — для сканов текста/формул это почти не заметно на глаз,
   а вес обычно падает в 5-15 раз. Если что-то пошло не так (canvas недоступен,
   ошибка декодирования) — используется исходный файл как есть, ничего не теряется. */
function compressImageFile(file, maxDim, quality){
  maxDim = maxDim || 1500;
  quality = quality || 0.82;
  return new Promise(resolve=>{
    if(!file || !file.type || !file.type.startsWith('image/')){
      fileToDataURL(file).then(resolve).catch(()=>resolve(null));
      return;
    }
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if(!w || !h){ resolve(reader.result); return; }
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        try{
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff'; // фон под прозрачность PNG — при JPEG прозрачности всё равно нет
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          const jpegUrl = canvas.toDataURL('image/jpeg', quality);
          // подстраховка: если пересжатая версия почему-то оказалась тяжелее исходника
          // (бывает с уже маленькими/простыми картинками) — берём то, что легче
          resolve(jpegUrl.length < reader.result.length ? jpegUrl : reader.result);
        }catch(e){
          resolve(reader.result);
        }
      };
      img.onerror = ()=>resolve(reader.result);
      img.src = reader.result;
    };
    reader.onerror = ()=>resolve(null);
    reader.readAsDataURL(file);
  });
}

/* То же сжатие, что и compressImageFile, но для картинки, УЖЕ хранящейся как
   base64 data-URL (не File) — используется для "пересжатия" уже сохранённых
   картинок параграфа, в частности тех, что попали через импорт JSON и не
   проходили через компрессию (импортированные файлы могут быть исходными
   сканами в несколько МБ каждый). */
function compressDataUrl(dataUrl, maxDim, quality){
  maxDim = maxDim || 1500;
  quality = quality || 0.78;
  return new Promise(resolve=>{
    if(!dataUrl || typeof dataUrl !== 'string' || !dataUrl.startsWith('data:image')){ resolve(dataUrl); return; }
    const img = new Image();
    img.onload = ()=>{
      let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if(!w || !h){ resolve(dataUrl); return; }
      if(w > maxDim || h > maxDim){
        if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      try{
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const jpegUrl = canvas.toDataURL('image/jpeg', quality);
        resolve(jpegUrl.length < dataUrl.length ? jpegUrl : dataUrl);
      }catch(e){ resolve(dataUrl); }
    };
    img.onerror = ()=>resolve(dataUrl);
    img.src = dataUrl;
  });
}

async function recompressImagesArray(arr, maxDim){
  const out = [];
  for(const src of (arr||[])) out.push(await compressDataUrl(src, maxDim, 0.78));
  return out;
}


async function addImageBlobsToDraft(key, blobs, field){
  field = field || 'images';
  if(!teacherDrafts[key]) teacherDrafts[key] = {text:'',answer:'',images:[],wideImages:[]};
  if(!teacherDrafts[key][field]) teacherDrafts[key][field] = [];
  // "Картинка на всю ширину" обычно содержит больше мелких деталей/текста
  // (схемы, таблицы, целые страницы) — оставляем ей чуть больший размер,
  // чем узкой колонке "images" слева от текста.
  const maxDim = field === 'wideImages' ? 1700 : 1100;
  for(const b of blobs){
    try{ const url = await compressImageFile(b, maxDim, 0.82); if(url) teacherDrafts[key][field].push(url); }
    catch(e){}
  }
  refreshDraftUI(key, field);
}

async function addImagesToDraft(key, evt, field){
  const files = Array.from(evt.target.files || []);
  evt.target.value = '';
  await addImageBlobsToDraft(key, files, field);
}

/* Единый трекер «где сейчас работает пользователь с картинками» — обновляется
   и по клику (capture-фаза, срабатывает даже на некликабельных div/label —
   именно там раньше был баг: клик по подписи/галерее НЕ меняет document.activeElement,
   старый фокус в другом поле оставался «главным» и побеждал новый клик), и по
   реальному фокусу (focusin — например при переходе по Tab). Кто сработал позже —
   тот и прав, отдельно проверять document.activeElement в момент paste не нужно. */
let lastImgKey = null, lastImgField = null;
function trackImgTarget(el){
  const keyEl = el.closest && el.closest('[data-imgkey]');
  if(!keyEl) return;
  const fieldEl = el.closest && el.closest('[data-imgfield]');
  lastImgKey = keyEl.getAttribute('data-imgkey');
  lastImgField = fieldEl ? fieldEl.getAttribute('data-imgfield') : null;
}
document.addEventListener('click', (e)=>trackImgTarget(e.target), true);
document.addEventListener('focusin', (e)=>trackImgTarget(e.target));

/* Вставка картинки из буфера обмена (Ctrl+V) прямо в нужное поле —
   «Изображения условия» (слева) или «Картинка на всю ширину» (внизу задачи).
   Источник истины — lastImgKey/lastImgField (см. trackImgTarget выше). Если
   пользователь ещё никуда не кликал — ничего не вставляем (не угадываем),
   чтобы не промахнуться мимо задачи. */
document.addEventListener('paste', async (e)=>{
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  const imageItems = Array.from(items).filter(it => it.kind === 'file' && it.type && it.type.startsWith('image/'));
  if(!imageItems.length) return;
  if(!lastImgKey) return; // не найдено надёжного адресата

  e.preventDefault();
  const key = lastImgKey;
  const field = lastImgField || 'images';
  const blobs = imageItems.map(it=>it.getAsFile()).filter(Boolean);
  if(field.indexOf('orig:') === 0){
    for(const b of blobs) await insertOriginalImage(key, b);
    return;
  }
  if(field.indexOf('chain:') === 0){
    if(blobs[0]) await insertChainImage(key, blobs[0]);
    return;
  }
  if(field.indexOf('guided:') === 0){
    const guidedField = field.slice('guided:'.length);
    if(guidedField === 'condLeft'){ await addGuidedLeftImages(key, blobs); return; }
    const file = blobs[0];
    if(file) await setGuidedSingleImage(key, guidedField, file);
    return;
  }
  await addImageBlobsToDraft(key, blobs, field);
});

function removeImageFromDraft(key, idx, field){
  field = field || 'images';
  teacherDrafts[key][field].splice(idx,1);
  refreshDraftUI(key, field);
}

/* Перед любой перерисовкой строки (добавление картинки, переключение
   галочки «есть доп. задача») подтягиваем из DOM в teacherDrafts всё, что
   пользователь мог успеть напечатать — иначе innerHTML-перерисовка это сотрёт. */
function syncFollowUpInputs(key){
  const d = teacherDrafts[key];
  if(!d) return;
  const cb = document.getElementById('fu-check-'+key);
  const ft = document.getElementById('fu-text-'+key);
  const fa = document.getElementById('fu-answer-'+key);
  const fs = document.getElementById('fu-solution-'+key);
  if(cb) d.hasFollowUp = cb.checked;
  if(ft) d.fuText = ft.value;
  if(fa) d.fuAnswer = fa.value;
  if(fs) d.fuSolutionText = fs.value;
}

function toggleFollowUp(key){
  refreshDraftUI(key, null);
}

function syncNewMainInputs(){
  const d = teacherDrafts['new'];
  if(!d) return;
  const t = document.getElementById('new-text');
  const a = document.getElementById('new-answer');
  const s = document.getElementById('new-solution');
  if(t) d.text = t.value;
  if(a) d.answer = a.value;
  if(s) d.solutionText = s.value;
}

function refreshDraftUI(key, field){
  lastImgKey = key;
  lastImgField = field || null;
  if(key === 'new'){
    syncNewMainInputs();
    syncFollowUpInputs('new');
    drawProblemsTab();
    refocusImgField(document.getElementById('add-form'), field);
    return;
  }
  const [par, num] = key.split('-').map(Number);
  const row = document.getElementById('row-'+key);
  if(row){
    const t = document.getElementById('text-'+key), a = document.getElementById('answer-'+key), s = document.getElementById('solution-'+key);
    if(t) teacherDrafts[key].text = t.value;
    if(a) teacherDrafts[key].answer = a.value;
    if(s) teacherDrafts[key].solutionText = s.value;
    syncFollowUpInputs(key);
    row.outerHTML = problemEditRow(par, num);
    refocusImgField(document.getElementById('row-'+key), field);
  }
}

/* После перерисовки строки браузер сбрасывает фокус на <body>. Возвращаем фокус
   на файловый input внутри того же блока картинок, чтобы следующая вставка
   Ctrl+V без лишнего клика попала туда же (а не потерялась/промахнулась). */
function refocusImgField(scopeEl, field){
  if(!scopeEl || !field) return;
  const target = scopeEl.querySelector(`[data-imgfield="${field}"] input[type="file"]`);
  if(target) target.focus({preventScroll:true});
}

/* ---------- Панель формул: степени, индексы, корень и другие символы ---------- */
function insertAtCursor(id, str){
  const el = document.getElementById(id);
  if(!el) return;
  const start = el.selectionStart != null ? el.selectionStart : el.value.length;
  const end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
  el.value = el.value.slice(0, start) + str + el.value.slice(end);
  const pos = start + str.length;
  el.focus();
  el.setSelectionRange(pos, pos);
}

const FORMULA_BUTTONS = [
  ['x²','²'],
  ['a\u20D7','\u20D7'],
  ['α','α'],['β','β'],['γ','γ'],['φ','φ'],['ω','ω'],['η','η'],['ν','ν'],['τ','τ'],['μ','μ'],['ℰ','ℰ'],
  ['π','π'],['Δ','Δ'],['·','·'],['×','×'],['÷','÷'],['−','−'],['±','±'],['°','°'],['≈','≈'],['≤','≤'],['≥','≥'],['→','→'],
  ['∪','∪'],['ℤ','ℤ'],['ℕ','ℕ'],['∞','∞']
];

/* Оборачивает выделенный текст в prefix{...}, либо, если ничего не выделено,
   вставляет шаблон с курсором внутри скобок. Общая логика для √{}, ^{} и _{}. */
function insertWrapTemplate(id, prefix){
  const el = document.getElementById(id);
  if(!el) return;
  const start = el.selectionStart != null ? el.selectionStart : el.value.length;
  const end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
  const selected = el.value.slice(start, end);
  const str = prefix + '{' + selected + '}';
  el.value = el.value.slice(0, start) + str + el.value.slice(end);
  const pos = selected ? (start + str.length) : (start + prefix.length + 1);
  el.focus();
  el.setSelectionRange(pos, pos);
}
function insertSqrtTemplate(id){ insertWrapTemplate(id, '√'); }
function insertOverlineTemplate(id){ insertWrapTemplate(id, '#'); }
function insertSupTemplate(id){ insertWrapTemplate(id, '^'); }
function insertSubTemplate(id){ insertWrapTemplate(id, '_'); }
function insertBoldTemplate(id){ insertWrapTemplate(id, '*'); }
function insertItalicTemplate(id){ insertWrapTemplate(id, '%'); }
function insertUprightTemplate(id){ insertWrapTemplate(id, '!'); }
function insertNoBreakTemplate(id){ insertWrapTemplate(id, '@'); }

/* Корень произвольной степени: ^{n}√{выражение} — верхний индекс со степенью
   корня сразу перед знаком корня (см. formatMath: ^{} даёт <sup>, а следующий
   за ним √{} — обычный радикал; вместе они читаются как ⁿ√). Если выделен
   текст — он становится подкоренным выражением, а курсор ставится в пустые
   скобки степени, чтобы сразу вписать показатель (например «3» для кубического
   корня). */
function insertNthRootTemplate(id){
  const el = document.getElementById(id);
  if(!el) return;
  const start = el.selectionStart != null ? el.selectionStart : el.value.length;
  const end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
  const selected = el.value.slice(start, end);
  const str = '^{}√{' + selected + '}';
  el.value = el.value.slice(0, start) + str + el.value.slice(end);
  const pos = start + 2; // курсор внутри ^{} — сюда вписывается степень корня
  el.focus();
  el.setSelectionRange(pos, pos);
}

/* Система уравнений/неравенств (аналог LaTeX \begin{cases}) — вставляет
   блок [sys]...[/sys] с двумя пустыми строками-уравнениями; учитель дописывает
   нужное количество строк, скобка слева растягивается автоматически на любое
   их число (см. formatPhysicsText/sysBraceSvg). Без переноса строки СРАЗУ после
   [/sys] — иначе этот символ остаётся обычным текстом сразу за блоком и
   smartWrap() принимает его за начало нового абзаца (пустая строка перед
   следующим текстом), даже если учитель печатает дальше без нажатия Enter. */
function insertSysTemplate(id){
  insertAtCursor(id, '\n[sys]\n\n\n[/sys]');
}

/* Дробь с горизонтальной чертой: /{числитель}{знаменатель}.
   Если выделен текст — он становится числителем, курсор переходит в пустой знаменатель. */
function insertFracTemplate(id){
  const el = document.getElementById(id);
  if(!el) return;
  const start = el.selectionStart != null ? el.selectionStart : el.value.length;
  const end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
  const selected = el.value.slice(start, end);
  const str = '/{' + selected + '}{}';
  el.value = el.value.slice(0, start) + str + el.value.slice(end);
  const pos = start + 2 + selected.length + 2; // курсор внутри знаменателя
  el.focus();
  el.setSelectionRange(pos, pos);
}

/* Растягивающиеся скобки (...)/[...] — сами становятся выше, если внутри
   есть дробь (см. formatMath: класс bracket-tall при наличии /{}{} внутри).
   Если выделен текст — он оборачивается в скобки (с автоматическим срезом
   уже имеющихся крайних скобок в выделении, чтобы не задваивать при повторном
   нажатии), иначе вставляется пустой шаблон с курсором внутри. */
function insertBracketTemplate(id, open, close){
  const el = document.getElementById(id);
  if(!el) return;
  const start = el.selectionStart != null ? el.selectionStart : el.value.length;
  const end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
  let selected = el.value.slice(start, end);
  if(selected.startsWith(open)) selected = selected.slice(1);
  if(selected.endsWith(close)) selected = selected.slice(0, -1);
  const str = open + '{' + selected + '}' + close;
  el.value = el.value.slice(0, start) + str + el.value.slice(end);
  const pos = selected ? (start + str.length) : (start + open.length + 1);
  el.focus();
  el.setSelectionRange(pos, pos);
}
function insertParenTemplate(id){ insertBracketTemplate(id, '(', ')'); }
function insertSquareBracketTemplate(id){ insertBracketTemplate(id, '[', ']'); }

/* Запись вида «ядерная физика»: массовое и зарядовое число друг над другом слева от символа: ~{A}{Z}. */
function insertNuclideTemplate(id){
  const el = document.getElementById(id);
  if(!el) return;
  const start = el.selectionStart != null ? el.selectionStart : el.value.length;
  const end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
  el.value = el.value.slice(0, start) + '~{}{}' + el.value.slice(end);
  const pos = start + 2; // курсор внутри первых скобок (массовое число)
  el.focus();
  el.setSelectionRange(pos, pos);
}

/* Вставляет шаблон небольшой таблицы 2×2 — строки данных, столбцы через | ; учитель дописывает по образцу. */
function insertTableTemplate(id){
  insertAtCursor(id, '\n[table]\n |  | \n |  | \n[/table]\n');
}

/* Вставляет шаблон "[cols]...[/cols]" — часть текста внутри выводится в 2
   колонки (например, длинный список вариантов ответа 1)/2)/3)/4)). Каждая
   строка внутри — отдельный пункт колонки. */
function insertColsTemplate(id){
  insertAtCursor(id, '\n[cols]\n1) \n2) \n3) \n4) \n[/cols]\n');
}

/* Принудительный перенос на новую строку — БЕЗ пустой строки-отступа перед ним.
   smartWrap() автоматически сворачивает обычные одиночные переносы строк (Enter)
   в пробел (это нужно, чтобы убирать вынужденные переносы вёрстки исходного PDF),
   и сохраняет разрыв только если строка целиком пустая (настоящий абзац) или
   совпадает с одним из известных паттернов (варианты ответа, "Ответ:" и т.п.).
   Обычный одиночный \n тут не подходит — он был бы молча склеен обратно. Поэтому
   после \n вставляется невидимый маркер PARAGRAPH_BREAK_MARKER (см. выше, у
   formatMath) — smartWrap() распознаёт его как "здесь точно нужен перенос" и
   вырезает перед выводом, так что в итоге получается просто перенос строки
   без визуального пустого промежутка. */
function insertParagraphBreak(id){
  insertAtCursor(id, '\n' + PARAGRAPH_BREAK_MARKER);
}

function loadTextFileInto(inputId, evt){
  const file = evt.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{ document.getElementById(inputId).value = r.result; };
  r.readAsText(file, 'UTF-8');
  evt.target.value = '';
}

function moveTargetOptions(par, num){

/* =====================================================================
   ОБЩИЙ ДВИЖОК «НАВОДЯЩИХ ВОПРОСОВ» — для Повышенного (вставка в
   problemEditRow, рядом с существующими полями) и Профильного (как часть
   отдельного guidedEditRow) уровней.

   Формат текста (тот же, что обкатан в редакторе-артефакте):
     ## цепочка: Название      (необязательно; без неё — одна безымянная цепочка)
     ## шаг
     ?? текст вопроса
     ++ доп. подсказка          (необязательно)
     == кусок решения
     ??img: ссылка              (необязательно, картинка к вопросу)
     ==img: ссылка              (необязательно, картинка к ответу)

   Используется formulaToolbarHtml(id) — та же панель формул, что и у
   остальных текстовых полей панели учителя, так что отдельную панель
   символов изобретать не нужно.

   ВСТАВИТЬ: этот файл целиком — в <script> сайта, в любое место после
   определения formulaToolbarHtml/escapeHtml/escapeAttr (они уже есть в
   phys_ege_index.html).
   ===================================================================== */

/* ---------- Картинки шагов: короткие токены вместо base64 в textarea ----------
   В тексте цепочек картинка выглядит как «??img: [img:k7f3a]», а сами данные
   лежат в chainImgStore. Парсер разворачивает токен обратно в data URL,
   guidedChainsToText — наоборот (для уже сохранённых картинок). */
const chainImgStore = {};
let chainImgPendingKind = null;
function chainImgNewId(){ return 'i' + Math.random().toString(36).slice(2, 8); }
function chainImgResolve(v){
  const m = /^\[img:([a-z0-9]+)\]$/i.exec(v || '');
  return (m && chainImgStore[m[1]]) ? chainImgStore[m[1]] : v;
}
function chainImgTokenFor(v){
  if (!v || String(v).indexOf('data:') !== 0) return v;
  const id = chainImgNewId();
  chainImgStore[id] = v;
  return '[img:' + id + ']';
}

/* Вставка картинки в textarea цепочек (Ctrl+V или кнопка). kind: '??' —
   к вопросу, '==' — к решению; если не задан, определяется по ближайшей
   строке-маркеру выше курсора. Строка с картинкой добавляется после
   текущей строки. */
async function insertChainImage(key, file, kind){
  if (!file) return;
  const ta = document.getElementById('chains-' + key);
  if (!ta) return;
  const dataUrl = await compressImageFile(file, 1000, 0.8);
  const id = chainImgNewId();
  chainImgStore[id] = dataUrl;
  const text = ta.value;
  let pos = (typeof ta.selectionStart === 'number') ? ta.selectionStart : text.length;
  if (!kind){
    kind = '==';
    const before = text.slice(0, pos).split('\n');
    for (let i = before.length - 1; i >= 0; i--){
      const l = before[i].trim();
      if (l.startsWith('??img:') || l.startsWith('==img:')) continue;
      if (l.startsWith('??')){ kind = '??'; break; }
      if (l.startsWith('==') || l.startsWith('++')){ kind = '=='; break; }
      if (/^##\s*шаг/i.test(l)){ kind = '??'; break; }
    }
  }
  let eol = text.indexOf('\n', pos);
  if (eol < 0) eol = text.length;
  const ins = '\n' + kind + 'img: [img:' + id + ']';
  ta.value = text.slice(0, eol) + ins + text.slice(eol);
  const np = eol + ins.length;
  ta.focus();
  ta.setSelectionRange(np, np);
  updateGuidedPreviewLive(key);
}

function pickChainImage(key, kind){
  chainImgPendingKind = kind;
  const inp = document.getElementById('chimg-' + key);
  if (inp) inp.click();
}

/* ---------- ПАРСЕР: текст -> массив цепочек ---------- */
function parseGuidedChains(text){
  const lines = (text||'').replace(/\r/g,'').split('\n');
  const chains = [];
  let curChain = null, curStep = null, lastField = null, pendingBlank = false;

  function ensureChain(name){
    curChain = { name: name || null, steps: [] };
    chains.push(curChain);
  }

  for (const raw of lines){
    const l = raw.trim();
    if (l === ''){ if (curStep && lastField) pendingBlank = true; continue; }
    const wasBlank = pendingBlank; pendingBlank = false;

    if (/^##\s*цепочка:/i.test(l)){
      ensureChain(l.replace(/^##\s*цепочка:\s*/i,'').trim());
      curStep = null; lastField = null; continue;
    }
    if (/^##\s*шаг/i.test(l)){
      if (!curChain) ensureChain(null);
      curStep = { q:'', hint:'', piece:'', qimg:'', pimg:'' };
      curChain.steps.push(curStep);
      lastField = null; continue;
    }
    if (l.startsWith('??img:')){ if (curStep) curStep.qimg = chainImgResolve(l.slice(6).trim()); continue; }
    if (l.startsWith('==img:')){ if (curStep) curStep.pimg = chainImgResolve(l.slice(6).trim()); continue; }
    if (l.startsWith('??')){
      if (!curStep){ if (!curChain) ensureChain(null); curStep = { q:'', hint:'', piece:'', qimg:'', pimg:'' }; curChain.steps.push(curStep); }
      curStep.q = l.slice(2).trim(); lastField = 'q'; continue;
    }
    if (l.startsWith('++')){ if (curStep){ curStep.hint = l.slice(2).trim(); lastField = 'hint'; } continue; }
    if (l.startsWith('==')){ if (curStep){ curStep.piece = l.slice(2).trim(); lastField = 'piece'; } continue; }

    // Продолжение предыдущего поля на новой строке. Переносы сохраняем как \n —
    // дальше formatPhysicsText/smartWrap сам решает, что склеить (обычный Enter),
    // а что оставить разрывом (кнопка «¶ Абзац», пустая строка, 1) 2) …, блоки
    // [table]/[cols]/[sys] на нескольких строках).
    if (curStep && lastField) curStep[lastField] += (wasBlank ? '\n\n' : '\n') + l;
  }
  return chains;
}

/* ---------- ОБРАТНОЕ ПРЕОБРАЗОВАНИЕ: массив цепочек -> текст ----------
   Нужно, чтобы при открытии уже сохранённой задачи в редакторе учитель
   увидел текстовый формат, а не голый JSON. */
function guidedChainsToText(chains){
  if (!chains || !chains.length) return '';
  const out = [];
  for (const chain of chains){
    if (chain.name) out.push('## цепочка: ' + chain.name);
    for (const s of (chain.steps||[])){
      out.push('## шаг');
      out.push('?? ' + (s.q||''));
      if (s.qimg) out.push('??img: ' + chainImgTokenFor(s.qimg));
      if (s.hint) out.push('++ ' + s.hint);
      out.push('== ' + (s.piece||''));
      if (s.pimg) out.push('==img: ' + chainImgTokenFor(s.pimg));
    }
    out.push('');
  }
  return out.join('\n').trim();
}

/* ---------- ПРЕВЬЮ: массив цепочек -> HTML как увидит ученик ----------
   Все шаги сразу раскрыты (это предпросмотр для учителя при редактировании,
   не имитация клика ученика — как договаривались для редактора). */
function renderGuidedChainsPreview(chains, activeIdx){
  if (!chains || !chains.length) return '<div class="muted">Пока пусто — опишите хотя бы один шаг.</div>';
  const showTabs = chains.length > 1;
  const act = Math.min(Math.max(activeIdx || 0, 0), chains.length - 1);
  let html = '';
  if (showTabs){
    html += '<div class="gc-tabs">';
    chains.forEach((c, ci) => {
      html += `<button type="button" class="gc-tab${ci===act?' active':''}" data-gc-tab="${ci}">${escapeHtml(c.name || ('Цепочка '+(ci+1)))}</button>`;
    });
    html += '</div>';
  }
  chains.forEach((c, ci) => {
    if (!showTabs && c.name) html += `<div class="gc-chain-title">${escapeHtml(c.name)}</div>`;
    html += `<div class="gc-chain${ci===act?' active':''}" data-gc-chain="${ci}">`;
    (c.steps||[]).forEach(s => {
      html += '<div class="gc-step done">'; // в редакторе всё сразу раскрыто
      html += `<div class="gc-q problem-text">${formatSolutionText ? formatSolutionText(s.q||'') : escapeHtml(s.q||'')}${s.qimg?`<img src="${escapeAttr(s.qimg)}">`:''}</div>`;
      let a = formatSolutionText ? formatSolutionText(s.piece||'') : escapeHtml(s.piece||'');
      if (s.hint) a = `<div class="gc-hint">${formatSolutionText(s.hint)}</div>` + a;
      if (s.pimg) a += `<img src="${escapeAttr(s.pimg)}">`;
      html += `<div class="gc-a problem-text">${a}</div>`;
      html += '</div>';
    });
    html += '</div>';
  });
  return html;
}

/* Какая вкладка превью («Обоснование»/«Решение») сейчас показана — запоминаем
   по ключу задачи и определяем по тому, в какой цепочке стоит курсор в тексте,
   чтобы превью не прыгало на первую вкладку при каждой правке. */
const gcActiveTab = {};
function chainIndexAtCaret(ta){
  const before = ta.value.slice(0, typeof ta.selectionStart === 'number' ? ta.selectionStart : ta.value.length).split('\n');
  let count = 0;
  for (const raw of before){
    const l = raw.trim();
    if (/^##\s*цепочка:/i.test(l)) count++;
    else if (count === 0 && (/^##\s*шаг/i.test(l) || l.startsWith('??'))) count = 1;
  }
  return Math.max(count - 1, 0);
}
function gcSyncFromCaret(key){
  const ta = document.getElementById('chains-' + key);
  if (!ta) return;
  const idx = chainIndexAtCaret(ta);
  if (gcActiveTab[key] === idx) return;
  gcActiveTab[key] = idx;
  const box = document.getElementById('gc-preview-' + key);
  if (box && box.style.display !== 'none') box.innerHTML = renderGuidedChainsPreview(parseGuidedChains(ta.value), idx);
}

function toggleGuidedPreview(key){
  const box = document.getElementById('gc-preview-' + key);
  const showing = box.style.display !== 'none';
  if (showing){ box.style.display = 'none'; return; }
  const text = document.getElementById('chains-' + key).value;
  const chains = parseGuidedChains(text);
  const ta0 = document.getElementById('chains-' + key);
  if (document.activeElement === ta0) gcActiveTab[key] = chainIndexAtCaret(ta0);
  box.innerHTML = renderGuidedChainsPreview(chains, gcActiveTab[key] || 0);
  box.style.display = 'block';
}

/* Пока превью открыто — обновлять его на каждое изменение текста, а не
   только при сворачивании/разворачивании кнопкой. */
function updateGuidedPreviewLive(key){
  const box = document.getElementById('gc-preview-' + key);
  if (!box || box.style.display === 'none') return;
  const ta = document.getElementById('chains-' + key);
  gcActiveTab[key] = chainIndexAtCaret(ta);
  box.innerHTML = renderGuidedChainsPreview(parseGuidedChains(ta.value), gcActiveTab[key]);
}

/* §42,44,46,48,50... — "Подготовка к части II", Повышенный уровень: те же
   questions/answer_key, что у обычных задач, плюс поле hint_chain
   (наводящие вопросы, видны ученику сразу — не секрет, в отличие от ответа). */
function isPovyshPar(par){ return par >= 42 && par % 2 === 0; }

/* =====================================================================
   ПРОФИЛЬНЫЙ УРОВЕНЬ — показ ученику + редактирование в панели учителя.
   Таблица guided_questions, не questions/answer_key. §43,45,47,49,51...
   ===================================================================== */

function isGuidedPar(par){ return par >= 43 && par % 2 === 1; }

/* ---------- ЗАГРУЗКА ДАННЫХ (параллельно ensureParLoaded/getParBlob) ---------- */
let guidedParLoaded = {};
if(!state.guidedBlobs) state.guidedBlobs = {};
if(!state.guidedProgress) state.guidedProgress = {};

/* Картинки слева от условия профильных задач. Отдельной колонки в
   guided_questions под них нет (cond_img — одна «широкая» картинка под
   текстом), поэтому они хранятся прямо в тексте условия отдельными строками
   {{limg:data:image/...}}; при чтении вырезаются, при сохранении добавляются. */
const COND_LIMG_RE = /^\s*\{\{limg:(data:[^}\s]+)\}\}\s*$/;
function splitCondition(text){
  const images = [], lines = [];
  String(text||'').split('\n').forEach(l=>{
    const m = COND_LIMG_RE.exec(l);
    if(m) images.push(m[1]); else lines.push(l);
  });
  return { text: lines.join('\n').replace(/\s+$/,''), images };
}
function joinCondition(text, images){
  const lines = [];
  const t = String(text||'').replace(/\s+$/,'');
  if(t) lines.push(t);
  (images||[]).forEach(src=>lines.push('{{limg:' + src + '}}'));
  return lines.join('\n');
}
/* Условие + картинки слева + широкая картинка под текстом — как у обычных задач */
function guidedConditionBodyHtml(prob){
  const left = prob.condLeft || [];
  return `<div class="problem-body">
      ${left.length ? `<div class="problem-media">${left.map(src=>`<img src="${escapeAttr(src)}" alt="Условие задачи">`).join('')}</div>` : ''}
      <div class="problem-text-col"><div class="problem-text">${formatPhysicsText(prob.condition||'')}</div></div>
    </div>
    ${prob.condImg ? `<div class="problem-wide-media"><img src="${escapeAttr(prob.condImg)}" alt="Условие задачи (целиком)"></div>` : ''}`;
}

async function ensureGuidedParLoaded(par, force){
  if(guidedParLoaded[par] && !force) return;
  const { data, error } = await sbSelect('guided_questions', { par: `eq.${par}`, select: '*' });
  const blob = {};
  if(!error && data){
    data.forEach(row=>{
      blob[row.num] = {
        condition: splitCondition(row.condition).text,
        condLeft: splitCondition(row.condition).images,
        condImg: row.cond_img || null,
        answer: row.answer || null,
        answerImg: row.answer_img || null,
        original: row.original || null,
        chains: row.chains || []
      };
    });
  }
  state.guidedBlobs[par] = blob;
  guidedParLoaded[par] = true;
}

function getGuidedBlob(par){ return state.guidedBlobs[par] || {}; }

async function fetchGuidedProblem(key, force){
  const [par, num] = key.split('-').map(Number);
  await ensureGuidedParLoaded(par, force);
  return getGuidedBlob(par)[num] || {condition:'', condLeft:[], condImg:null, answer:null, answerImg:null, original:null, chains:[]};
}

/* Прогресс ученика по Профильным задачам: { "par.num": {touched, hintViewed, color} } */
async function loadStudentGuidedProgress(name){
  const { data, error } = await sbRpcAll('get_student_guided_progress', { p_student_name: name });
  const result = {};
  if(!error && data){
    data.forEach(r=>{
      result[r.question_id] = { touched: !!r.touched, hintViewed: !!r.hint_viewed, color: r.color || null };
    });
  }
  return result;
}

function guidedChipHtml(par, num){

  let hinted = false;
  if(prog){

    hinted = prog.hintViewed && prog.color !== 'yellow';
  }

/* Рендер цепочек для УЧЕНИКА: шаги закрыты, открываются по клику один за
   другим (в отличие от превью в редакторе учителя, где всё сразу раскрыто). */
function renderGuidedStudentChains(chains, qid, kind){
  kind = kind || 'profil'; // 'profil' (guided_questions, touch_guided_hint) | 'povysh' (questions.hint_chain, view_hint)
  if(!chains || !chains.length) return '';
  const showTabs = chains.length > 1;
  let html = '<div class="gc-preview">';
  if(showTabs){
    html += '<div class="gc-tabs">';
    chains.forEach((c, ci) => {
      html += `<button type="button" class="gc-tab${ci===0?' active':''}" data-gc-tab="${ci}">${escapeHtml(c.name || ('Цепочка '+(ci+1)))}</button>`;
    });
    html += '</div>';
  }
  chains.forEach((c, ci) => {
    if(!showTabs && c.name) html += `<div class="gc-chain-title">${escapeHtml(c.name)}</div>`;
    html += `<div class="gc-chain${ci===0?' active':''}" data-gc-chain="${ci}">`;
    (c.steps||[]).forEach((s, si) => {
      // Учитель видит всё сразу: шаги раскрыты, подсказки показаны
      const teacher = !!state.isTeacher;
      const locked = (teacher || si === 0) ? '' : 'locked';
      html += `<div class="gc-step ${teacher ? 'done' : locked}" data-chain="${ci}" data-step="${si}">`;
      html += `<div class="gc-q problem-text">${formatSolutionText(s.q||'')}${s.qimg?`<img src="${escapeAttr(s.qimg)}">`:''}</div>`;
      if(teacher){
        if(s.hint) html += `<div class="gc-hint-text problem-text"><b>Подсказка:</b> ${formatSolutionText(s.hint)}</div>`;
      } else if(s.hint){
        html += `<div class="gc-hint-row">`;
        html += `<button type="button" class="gc-hint-toggle-btn" onclick="guidedHintToggle('${qid}', this, '${kind}')">Подсказка</button>`;
        html += `<button type="button" class="gc-hint-btn" ${si===0?'':'disabled'} onclick="guidedStepClick('${qid}', this, '${kind}')">Проверить ответ</button>`;
        html += `</div>`;
        html += `<div class="gc-hint-text problem-text" style="display:none;">${formatSolutionText(s.hint)}</div>`;
      } else {
        html += `<button type="button" class="gc-hint-btn" ${si===0?'':'disabled'} onclick="guidedStepClick('${qid}', this, '${kind}')">Проверить ответ</button>`;
      }
      let a = formatSolutionText(s.piece||'');
      if(s.pimg) a += `<img src="${escapeAttr(s.pimg)}">`;
      html += `<div class="gc-a problem-text">${a}</div>`;
      html += '</div>';
    });
    html += '</div>';
  });
  html += '</div>';
  return html;
}

/* "Подсказка" — отдельная, необязательная, не блокирует "Проверить ответ".
   Открывает текст подсказки обычным шрифтом (без мелкого .gc-hint — тот
   остался только в превью редактора). Тоже засчитывается как просмотр
   указания (та же РПЦ, что и "Проверить ответ"), но шаг не раскрывается. */
async function guidedHintToggle(qid, btn, kind){
  const row = btn.closest('.gc-hint-row');
  const textEl = row.nextElementSibling; // .gc-hint-text
  const showing = textEl.style.display !== 'none';

/* Клик по "Проверить ответ": открывает шаг, открывает следующий, и (если
   это не учитель) засчитывает просмотр подсказки — рамка навсегда. Кружок
   задачи у самого ученика при этом НЕ перекрашивается (это теперь видно
   только учителю, в сводке результатов) — только отправляем событие на
   сервер. */
async function guidedStepClick(qid, btn, kind){
  const step = btn.closest('.gc-step');
  step.classList.add('done');
  step.classList.remove('locked');
  const next = step.parentElement.querySelector(`.gc-step[data-step="${+step.dataset.step + 1}"]`);
  if(next){ next.classList.remove('locked'); next.querySelectorAll('.gc-hint-btn, .gc-hint-toggle-btn').forEach(b=>b.disabled=false); }
  await guidedRegisterHintUse(qid, kind);
}

async function guidedRegisterHintUse(qid, kind){
  if(state.isTeacher || !state.studentName) return;
  if(kind === 'povysh'){
    await sbRpc('view_hint', { p_student_name: state.studentName, p_question_id: qid });
  } else {
    await sbRpc('touch_guided_hint', { p_student_name: state.studentName, p_question_id: qid });
  }
}

async function guidedShowAnswer(qid, btn){
  const box = btn.nextElementSibling;
  box.style.display = (box.style.display === 'none' || !box.style.display) ? 'block' : 'none';
  if(!state.isTeacher && state.studentName){
    await sbRpc('touch_guided_question', { p_student_name: state.studentName, p_question_id: qid });

}

/* ---------- Картинки в «Полном решении» профильных задач ----------
   Отдельной колонки под них в guided_questions нет, поэтому картинки лежат
   прямо в тексте original отдельными строками вида {{img:data:image/jpeg;base64,...}}.
   В textarea учитель видит короткие токены [img:k7f3a] (хранилище chainImgStore
   то же, что у цепочек), при сохранении они превращаются обратно в {{img:...}}. */
const ORIG_IMG_RE = /^\s*\{\{img:(data:[^}\s]+)\}\}\s*$/;
const ORIG_TOKEN_RE = /^\s*\[img:([a-z0-9]+)\]\s*$/i;

function splitOriginal(text){
  const images = [], lines = [];
  String(text||'').split('\n').forEach(l=>{
    const m = ORIG_IMG_RE.exec(l);
    if(m) images.push(m[1]); else lines.push(l);
  });
  return { text: lines.join('\n').replace(/\n{3,}/g, '\n\n').trim(), images };
}
function originalToEditText(text){
  return String(text||'').split('\n').map(l=>{
    const m = ORIG_IMG_RE.exec(l);
    if(!m) return l;
    const id = chainImgNewId();
    chainImgStore[id] = m[1];
    return '[img:' + id + ']';
  }).join('\n');
}
function originalFromEditText(text){
  return String(text||'').split('\n').map(l=>{
    const m = ORIG_TOKEN_RE.exec(l);
    return (m && chainImgStore[m[1]]) ? '{{img:' + chainImgStore[m[1]] + '}}' : l;
  }).join('\n');
}
function originalPreviewHtml(text){
  const imgs = [];
  String(text||'').split('\n').forEach(l=>{
    const m = ORIG_TOKEN_RE.exec(l);
    if(m && chainImgStore[m[1]]) imgs.push(chainImgStore[m[1]]);
  });
  return imgs.map(src=>`<img src="${escapeAttr(src)}" style="max-width:140px;max-height:110px;border-radius:6px;border:1px solid var(--border,#ddd);">`).join('');
}
function updateOriginalPreview(key){
  const ta = document.getElementById('goriginal-' + key);
  const box = document.getElementById('gorig-prev-' + key);
  if(ta && box) box.innerHTML = originalPreviewHtml(ta.value);
}
async function insertOriginalImage(key, file){
  if(!file) return;
  const ta = document.getElementById('goriginal-' + key);
  if(!ta) return;
  const dataUrl = await compressImageFile(file, 1200, 0.82);
  const id = chainImgNewId();
  chainImgStore[id] = dataUrl;
  const det = ta.closest('details'); if(det) det.open = true;
  const text = ta.value;
  const pos = (typeof ta.selectionStart === 'number') ? ta.selectionStart : text.length;
  let eol = text.indexOf('\n', pos);
  if(eol < 0) eol = text.length;
  const ins = (text.length ? '\n' : '') + '[img:' + id + ']';
  ta.value = text.slice(0, eol) + ins + text.slice(eol);
  const np = eol + ins.length;
  ta.focus();
  ta.setSelectionRange(np, np);
  updateOriginalPreview(key);
}

/* Перед перерисовкой вкладки (после загрузки картинки к условию/ответу и т.п.)
   сохраняем набранное в полях в черновик — иначе перерисовка его сотрёт. */
function syncGuidedDraftFromDom(key){
  const d = guidedTeacherDrafts[key];
  if(!d) return;
  const g = id => document.getElementById(id);
  if(g('gcond-'+key)) d.condition = g('gcond-'+key).value;
  if(g('ganswer-'+key)) d.answer = g('ganswer-'+key).value;
  if(g('goriginal-'+key)) d.original = originalFromEditText(g('goriginal-'+key).value);
  if(g('chains-'+key)) d.chains = parseGuidedChains(g('chains-'+key).value);
}

  const failed = [];
  try{

      const { error } = await sbRpc('update_guided_question', {
        p_password_hash: state.teacherPasswordHash,
        p_id: key.replace('-', '.'),
        p_condition: fields.condition,
        p_cond_img: fields.condImg,
        p_answer: fields.answer,
        p_answer_img: fields.answerImg,
        p_original: fields.original,
        p_chains: fields.chains
      });
      if(error) failed.push(key.replace('-', '.') + ': ' + (error.message || 'ошибка'));
    }
    const scrollY = window.scrollY;
    if(failed.length){
      // не перерисовываем: набранное в полях остаётся на экране
      allBtns.forEach((b,i)=>{ b.disabled = false; b.textContent = labels[i]; });
      await customAlert('Не удалось сохранить: ' + failed.join('; ') + '. Остальные задачи сохранены.');
      return;
    }
    guidedParLoaded[par] = false;
    await loadGuidedParDrafts(par);
    drawGuidedProblemsTab();
    window.scrollTo(0, scrollY);
    document.querySelectorAll('.gsaveall-status').forEach(el=>{ el.textContent = 'Сохранено ✓ (' + keys.length + ')'; el.style.color = 'var(--green)'; });
    setTimeout(()=>{ document.querySelectorAll('.gsaveall-status').forEach(el=>{ el.textContent = ''; }); }, 4000);
  } finally {
    allBtns.forEach((b,i)=>{ if(document.body.contains(b)){ b.disabled = false; b.textContent = labels[i]; } });
  }
}

async function addGuidedProblem(btn){

  try{

      p_password_hash: state.teacherPasswordHash,
      p_par: teacherSelectedPar,
      p_num: num,
